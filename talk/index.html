<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어닝플레이스</title>
<style>body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F4F6FB;color:#141A2A;display:grid;place-items:center;min-height:100vh;text-align:center}
.c{padding:28px 22px;max-width:340px}img{width:52px;height:52px}h2{font-size:19px;margin:14px 0 8px}p{font-size:14.5px;line-height:1.6;color:#4B5563}</style></head>
<body><div class="c" id="c"><img src="../logo.svg" alt=""><h2>대화 여는 중…</h2></div>
<script>
// 카톡 알림톡 [대화 보기]/[답장하기] → 이 주소 (?k=코드.방번호)
//  m.코드 = 부동산(매물노트) · hq = 대표(HQ) · 그 외 = 클린 일정판
(function(){
  var q = new URLSearchParams(location.search), k = q.get('k') || '', room = '', app = q.get('app') === 'chat' ? '&app=chat' : '';   // app=chat: 어닝톡 푸시에서 열 때
  var m = k.match(/^(.*)\.(\d+)$/); if (m) { k = m[1]; room = m[2]; }
  if (k === 'hq') { location.replace('../hq/' + (app ? '?app=chat' : '') + '#chat' + (room ? '/' + room : '')); return; }
  if (k.indexOf('m.') === 0) { k = k.slice(2); location.replace('../maemul/?k=' + encodeURIComponent(k) + '&chat=' + (room || 'list') + app); return; }
  if (k) { location.replace('../clean/?k=' + encodeURIComponent(k) + '&chat=' + (room || 'list') + app); return; }
  location.replace('../go/');
})();
</script></body></html>
