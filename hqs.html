<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16347A">
<title>HQS · 어닝플레이스</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:1320px;margin:0 auto;padding:14px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:18px;font-weight:900;display:block;line-height:1.15;letter-spacing:-.01em}
.brand small{font-size:12px;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
.kpi span{font-size:12px;color:var(--sub)}
.kpi b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media(min-width:1100px){.grid{grid-template-columns:200px minmax(0,1fr) 360px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ph h2{font-size:15px;font-weight:700;margin:0}
.org{padding:6px}
@media(max-width:1099px){.org{display:flex;overflow-x:auto;gap:4px}.org button{width:auto;white-space:nowrap}.org .sub{padding-left:10px}.orgp .ph{display:none}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.org button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:10px;padding:8px 10px;text-align:left;font-size:14px}
.org button:hover{background:var(--soft)}
.org button[aria-pressed=true]{background:var(--infob);font-weight:700}
.org .code{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:1px 6px;min-width:34px;text-align:center}
.org .n{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
.org .sub{padding-left:22px}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:13px;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:6px}
.nav button.ic{border:1px solid var(--line);background:var(--card);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;color:var(--sub)}
.nav b{font-size:14px;min-width:150px;text-align:center}
.days{padding:4px 14px 14px}
.dayh{display:flex;align-items:baseline;gap:8px;padding:12px 0 8px;font-weight:700;font-size:14px;position:sticky;top:0;background:var(--card);z-index:1}
.dayh span{font-weight:400;color:var(--sub);font-size:12.5px}
.dayh.today{color:var(--info)}
.job{border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 16px;margin-bottom:8px;position:relative}
.job::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--tc)}
.job.cancelled{opacity:.5}
.job .l1{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.job .tm{font-weight:700;font-variant-numeric:tabular-nums;margin-right:6px}
.job h4{margin:0;font-size:15px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;color:#fff}
.job .meta{font-size:12.5px;color:var(--sub);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.people{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.who{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--soft)}
.who.ok{background:var(--okb);border-color:transparent;color:#065F46}
.who.ok.unseen{background:var(--warnb);color:var(--warn)}
.who.wait{background:var(--waitb);border-color:transparent;color:var(--wait);padding-right:3px}
.who.wait button{border:0;border-radius:999px;font-size:11.5px;padding:2px 8px;background:var(--wait);color:#fff}
.who.wait button.no{background:transparent;color:var(--wait)}
.who .x{border:0;background:none;color:inherit;opacity:.6;padding:0 0 0 2px;font-size:12px}
.jacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.side .tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.side .tabs button{border:0;background:none;padding:8px 10px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.side .tabs button[aria-selected=true]{color:var(--ink);font-weight:700;border-color:var(--navy)}
.side .tabs .cnt{font-size:11px;background:var(--warn);color:#fff;border-radius:999px;padding:0 6px;font-weight:700;margin-left:3px}
.feed{padding:4px 14px 14px;max-height:72vh;overflow:auto}
.rep{padding:12px 0;border-bottom:1px solid var(--line)}
.rep .t{display:flex;gap:6px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.rep .t small{margin-left:auto;color:var(--mute);font-size:12px}
.rep p{margin:4px 0 0;font-size:14px;white-space:pre-wrap}
.rep .pics{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.rep .pics a img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block;background:var(--soft)}
.rep.new{background:linear-gradient(90deg,var(--infob),transparent 60%)}
.st{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.st .nm{font-weight:700}
.st small{color:var(--sub)}
.st .ops{display:flex;gap:4px;grid-column:1/-1;flex-wrap:wrap}
.ntc{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ntc small{color:var(--mute);font-size:12px;display:block}
.ntc p{margin:2px 0 4px;white-space:pre-wrap}
form.inline{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
form.inline textarea,form.inline input,form.inline select{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.on{display:flex}
.sheet{background:var(--card);border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:900}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.sec{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--mute);margin-top:6px;border-top:1px solid var(--line);padding-top:10px;display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;background:var(--card)}
.chips input:checked+span{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
.chips input:focus-visible+span{outline:2px solid var(--info)}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1}
.payrow{display:grid;grid-template-columns:90px 1fr 110px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.payrow select,.payrow input{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:8px;width:100%}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:22px;font-weight:900}
.login p{margin:0;color:var(--sub);font-size:13.5px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
 <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
 <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
 <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
</svg>
<div id="root"><div class="spin"></div></div>
<div class="scrim" id="scrim" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
const C = window.EP_CONFIG;
const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const I = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const won = n => n == null ? '-' : Number(n).toLocaleString('ko-KR') + '원';
const ago = t => { if (!t) return '-'; const m = Math.round((Date.now()-new Date(t))/60000); return m<1?'방금':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전'; };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2400); }
const fail = e => { console.error(e); let b = document.getElementById('errbar'); if (!b){ b = document.createElement('div'); b.id='errbar'; b.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#FDECEC;color:#B91C1C;border:1px solid #F5B5B5;border-radius:12px;padding:10px 14px;font-size:13.5px;white-space:pre-wrap;box-shadow:0 8px 24px rgba(0,0,0,.15)'; b.onclick=()=>b.remove(); document.body.appendChild(b); } b.textContent = '오류 (눌러서 닫기)\n' + [e.message, e.details, e.hint, e.code].filter(Boolean).join('\n'); };
const TODAY = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

/* ---------- state ---------- */
let teams = [], staff = [], jobs = [], reports = [], notices = [], settings = {};
let teamF = 'ALL', range = 'week', anchor = TODAY(), side = 'rep';
const T = c => teams.find(t => t.code === c) || {code:c,name:c,color:'#999'};
const S = id => staff.find(s => s.id === id) || {name:'?'};

function rangeDates(){
  if (range === 'week'){ const s = addDays(anchor, -anchor.getDay()); return [s, addDays(s, 6)]; }
  if (range === 'month'){ return [new Date(anchor.getFullYear(), anchor.getMonth(), 1), new Date(anchor.getFullYear(), anchor.getMonth()+1, 0)]; }
  return [anchor, addDays(anchor, 13)];   // 2주
}

async function loadAll(){
  const [f, t] = rangeDates();
  const q = await Promise.all([
    sb.from('teams').select('*').order('sort'),
    sb.from('staff').select('*').order('created_at'),
    sb.from('jobs').select('*, assignments(*)').gte('job_date', ymd(f)).lte('job_date', ymd(t)).order('job_date').order('start_time', {nullsFirst:true}),
    sb.from('reports').select('*').order('created_at', {ascending:false}).limit(60),
    sb.from('notices').select('*, notice_reads(staff_id, read_at, confirmed_at)').order('created_at', {ascending:false}).limit(30),
    sb.from('settings').select('*')
  ]);
  for (const r of q) if (r.error) throw r.error;
  [teams, staff, jobs, reports, notices] = q.slice(0,5).map(r => r.data);
  settings = Object.fromEntries(q[5].data.map(r => [r.key, r.value]));
}

/* ---------- render ---------- */
function render(){
  const [f, t] = rangeDates();
  const shown = jobs.filter(j => teamF === 'ALL' || j.teams.includes(teamF));
  const act = j => j.status !== 'cancelled';
  const approved = j => j.assignments.filter(a => a.status === 'approved');
  const open = shown.filter(act).reduce((a,j) => a + Math.max(0, j.headcount - approved(j).length), 0);
  const waiting = shown.reduce((a,j) => a + j.assignments.filter(x => x.status === 'applied').length, 0);
  const unseen = shown.filter(act).reduce((a,j) => a + approved(j).filter(x => !x.seen_at || new Date(x.seen_at) < new Date(j.changed_at)).length, 0);
  const newRep = reports.filter(r => !r.checked_at).length;
  const collect = shown.filter(j => j.collector_id && j.balance_amount && !j.collected_at && act(j)).length;
  const rlabel = range==='month' ? `${f.getFullYear()}년 ${f.getMonth()+1}월` : `${f.getMonth()+1}/${f.getDate()} ~ ${t.getMonth()+1}/${t.getDate()}`;

  // days
  const byDay = {}; shown.forEach(j => (byDay[j.job_date] = byDay[j.job_date] || []).push(j));
  const today = ymd(TODAY());
  const daysHtml = Object.keys(byDay).sort().map(d => { const dd = parse(d);
    return `<div class="dayh ${d===today?'today':''}">${dd.getMonth()+1}월 ${dd.getDate()}일 ${DOW[dd.getDay()]}요일 <span>${byDay[d].length}건${d===today?' · 오늘':''}</span></div>` + byDay[d].map(jobCard).join(''); }).join('')
    || '<p class="empty">이 기간 일정이 없어요. 오른쪽 위 [일정 올리기]로 추가하세요.</p>';

  const orgBtn = (code, label, n, sub='') => { const tm = T(code);
    return `<button data-team="${code}" aria-pressed="${teamF===code}" class="${sub}">${code==='ALL'?'':`<span class="code" style="background:${tm.color}">${code}</span>`}${esc(label)}<span class="n">${n}</span></button>`; };

  $('#root').innerHTML = `<div class="wrap">
   <div class="top"><div class="brand"><img class="logo" src="logo.svg" alt=""><div><b>HQS</b><small>${esc(C.BRAND)} 본사 일정판</small></div></div>
     <div class="row" style="flex:0 0 auto"><button class="btn" data-new="1">${I('plus')}일정 올리기</button><button class="btn ghost sm" data-logout="1">로그아웃</button></div></div>
   <div class="kpis">
     <div class="kpi"><span>일정</span><b>${shown.filter(act).length}</b></div>
     <div class="kpi"><span>남은 자리</span><b style="color:${open?'var(--warn)':'var(--ink)'}">${open}</b></div>
     <div class="kpi"><span>승인 대기</span><b style="color:${waiting?'var(--wait)':'var(--ink)'}">${waiting}</b></div>
     <div class="kpi"><span>미확인 (연락 필요)</span><b style="color:${unseen?'var(--warn)':'var(--ink)'}">${unseen}</b></div>
     <div class="kpi"><span>수금 대기</span><b>${collect}</b></div>
     <div class="kpi"><span>새 보고</span><b style="color:${newRep?'var(--info)':'var(--ink)'}">${newRep}</b></div>
   </div>
   <div class="grid">
     <section class="panel orgp"><div class="ph"><h2>조직</h2></div><div class="org">
       ${orgBtn('ALL','HQS 전체', staff.filter(s=>s.status!=='left').length)}
       ${teams.filter(t=>t.code!=='HQS').map(t=>orgBtn(t.code, t.name, staff.filter(s=>s.team===t.code&&s.status!=='left').length, 'sub')).join('')}
     </div></section>
     <section class="panel"><div class="ph"><h2>${teamF==='ALL'?'전체 일정':esc(T(teamF).name)+' 일정'}</h2>
        <div class="row" style="flex:0 0 auto;gap:8px"><div class="seg">${[['week','주간'],['two','2주'],['month','월간']].map(([k,l])=>`<button data-range="${k}" aria-pressed="${range===k}">${l}</button>`).join('')}</div>
        <div class="nav"><button class="ic" data-move="-1" aria-label="이전">${I('left')}</button><b>${rlabel}</b><button class="ic" data-move="1" aria-label="다음">${I('right')}</button><button class="btn ghost sm" data-move="0">오늘</button></div></div></div>
       <div class="days">${daysHtml}</div></section>
     <section class="panel side"><div class="tabs" role="tablist">
        <button role="tab" data-side="rep" aria-selected="${side==='rep'}">보고함${newRep?`<span class="cnt">${newRep}</span>`:''}</button>
        <button role="tab" data-side="ntc" aria-selected="${side==='ntc'}">공지</button>
        <button role="tab" data-side="stf" aria-selected="${side==='stf'}">직원</button></div>
       <div class="feed" id="feed">${side==='rep'?repView():side==='ntc'?ntcView():stfView()}</div></section>
   </div></div>`;
  if (side === 'rep') loadPhotos();
}

function jobCard(j){
  const tm = T(j.teams[0]);
  const ap = j.assignments.filter(a => a.status === 'approved');
  const wait = j.assignments.filter(a => a.status === 'applied');
  const left = Math.max(0, j.headcount - ap.length);
  const pill = j.status==='cancelled' ? '<span class="pill p-mute">취소</span>'
    : j.status==='done' ? '<span class="pill p-mute">마감 완료</span>'
    : left===0 ? '<span class="pill p-ok">완 · 인원 세팅 끝</span>' : `<span class="pill p-warn">${left}자리 남음</span>`;
  const seen = a => a.seen_at && new Date(a.seen_at) >= new Date(j.changed_at);
  const people = ap.map(a => `<span class="who ok ${seen(a)?'':'unseen'}" title="${seen(a)?'확인함 '+ago(a.seen_at):'아직 안 봤어요'}">${seen(a)?'✓':'!'} ${esc(S(a.staff_id).name)}${j.status!=='done'?`<button class="x" data-unassign="${j.id}:${a.staff_id}" aria-label="배정 빼기">✕</button>`:''}</span>`).join('')
    + wait.map(a => `<span class="who wait">${esc(S(a.staff_id).name)} 신청<button data-approve="${j.id}:${a.staff_id}">승인</button><button class="no" data-reject="${j.id}:${a.staff_id}">거절</button></span>`).join('')
    + (j.status!=='done' && j.status!=='cancelled' ? `<button class="btn ghost sm" data-assign="${j.id}">+ 직접 배정</button>` : '');
  const money = (j.total_amount||j.balance_amount) ? `<span>총 ${won(j.total_amount)} · 잔금 ${won(j.balance_amount)}${j.collector_id?` (${esc(S(j.collector_id).name)} ${j.collected_at?'✓ '+esc(j.collected_how||'')+' 수금':'수금 대기'})`:''}</span>` : '';
  return `<div class="job ${j.status}" style="--tc:${tm.color}">
    <div class="l1"><h4><span class="tm">${j.start_time?j.start_time.slice(0,5):'시간 미정'}</span>${esc(j.title)} ${j.teams.map(c=>`<span class="tag" style="background:${T(c).color}">${c}</span>`).join('')}</h4>${pill}</div>
    <div class="meta"><span>${j.headcount}명 필요</span>${j.kind?`<span>${esc(j.kind)}</span>`:''}${j.order_channel?`<span>오더: ${esc(j.order_channel)}</span>`:''}${j.address?`<span>${I('lock').replace('class="i"','class="i" style="width:13px;height:13px"')} ${esc(j.address)}</span>`:''}${money}</div>
    ${j.admin_memo?`<div class="meta">메모: ${esc(j.admin_memo)}</div>`:''}
    <div class="people">${people}</div>
    <div class="jacts"><button class="btn ghost sm" data-edit="${j.id}">수정</button>${j.status!=='cancelled'&&j.status!=='done'?`<button class="btn ghost sm" data-close="${j.id}">당일 마감 · 금액 기입</button>`:''}${j.status==='done'?`<button class="btn ghost sm" data-close="${j.id}">금액 수정</button>`:''}<button class="btn ghost sm" data-copy="${j.id}">카톡 문구 복사</button></div>
  </div>`;
}

function repView(){
  return reports.map(r => { const s = S(r.staff_id), j = jobs.find(x=>x.id===r.job_id);
    return `<div class="rep ${r.checked_at?'':'new'}"><div class="t"><b>${esc(s.name)}</b><span class="tag" style="background:${T(s.team).color}">${s.team||''}</span><small>${ago(r.created_at)}</small></div>
      ${j?`<div class="meta" style="font-size:12px;color:var(--sub)">📍 ${esc(j.title)} · ${j.job_date.slice(5).replace('-','/')}</div>`:''}
      <p>${esc(r.body)}</p>${r.photos.length?`<div class="pics" data-pics="${r.id}">${r.photos.map(()=>'<a><img alt=""></a>').join('')}</div>`:''}
      ${r.checked_at?'':`<div class="jacts"><button class="btn ghost sm" data-chk="${r.id}">확인</button></div>`}</div>`; }).join('') || '<p class="empty">들어온 보고가 없어요</p>';
}
async function loadPhotos(){
  const all = reports.flatMap(r => r.photos); if (!all.length) return;
  const {data, error} = await sb.storage.from('reports').createSignedUrls(all, 3600); if (error) return;
  const map = Object.fromEntries(data.map(d => [d.path, d.signedUrl]));
  reports.forEach(r => { const box = document.querySelector(`[data-pics="${r.id}"]`); if (!box) return;
    box.querySelectorAll('a').forEach((a,i) => { const u = map[r.photos[i]]; if (u){ a.href = u; a.target = '_blank'; a.querySelector('img').src = u; } }); });
}
function ntcView(){
  const active = staff.filter(s => s.status !== 'left');
  return `<form class="inline" id="ntcForm"><input name="title" placeholder="제목 (선택)"><textarea name="body" rows="3" placeholder="직원들에게 알릴 내용" required></textarea>

    <label style="flex:0 0 auto;font-size:13px;display:flex;gap:4px;align-items:center"><input type="checkbox" name="important" style="width:auto">확인 버튼</label>

    <small style="color:var(--mute);font-size:12px">올린 뒤 카톡 채널로 "새 공지가 있어요 + 링크" 알림만 보내면 돼요. 누가 읽었는지는 여기서 보여요.</small></form>`
  + notices.map(n => { const target = active.filter(s => !n.team || s.team === n.team);

/* ---------- link / kakao text ---------- */
const base = () => location.origin + location.pathname.replace(/hqs\.html$/, '');
const linkOf = s => `${base()}?k=${s.token}`;
const linkMsg = s => `[${C.BRAND}] ${s.name}님 전용 일정판 링크예요.\n${linkOf(s)}\n\n· 일정 확인·신청, 현장 보고, 공지를 여기서 해요.\n· 본인만 쓰는 링크라 다른 분께 보내지 말아주세요.\n· 휴대폰 홈 화면에 추가해두시면 편해요.`;
function jobMsg(j){ const d = parse(j.job_date); return `[${C.BRAND}] 새 일정이 올라왔어요\n${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]}) ${j.start_time?j.start_time.slice(0,5):''} ${j.title}\n필요 ${j.headcount}명 · 일정판에서 신청해주세요`; }
async function copy(t, m){ try{ await navigator.clipboard.writeText(t); toast(m || '복사했어요'); } catch(_){ prompt('복사해서 쓰세요', t); } }

/* ---------- events ---------- */
async function refresh(){ try{ await loadAll(); render(); }catch(e){ fail(e); } }
const fd = f => new FormData(f);
const nn = v => v === '' || v == null ? null : v;
const nnum = v => v === '' || v == null ? null : Number(v);

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  try {
    if (d.closesheet) return closeSheet();
    if (d.logout){ await sb.auth.signOut(); location.reload(); return; }
    if (d.team){ teamF = d.team; render(); return; }
    if (d.range){ range = d.range; await refresh(); return; }
    if (d.move !== undefined){ const n = Number(d.move);
      anchor = n===0 ? TODAY() : range==='month' ? new Date(anchor.getFullYear(), anchor.getMonth()+n, 1) : addDays(anchor, n*(range==='week'?7:14));
      await refresh(); return; }
    if (d.side){ side = d.side; render(); return; }
    if (d.new){ jobSheet(); return; }
    if (d.edit){ jobSheet(jobs.find(j=>j.id==d.edit)); return; }
    if (d.close){ closeJobSheet(jobs.find(j=>j.id==d.close)); return; }
    if (d.assign){ assignSheet(jobs.find(j=>j.id==d.assign)); return; }
    if (d.copy){ copy(jobMsg(jobs.find(j=>j.id==d.copy)), '카톡 알림 문구 복사했어요'); return; }
    if (d.approve || d.reject){ const [jid, sid] = (d.approve||d.reject).split(':');
      const {error} = await sb.from('assignments').update({status: d.approve?'approved':'rejected', decided_at: new Date().toISOString()}).match({job_id:+jid, staff_id:sid}); if (error) throw error;
      const j = jobs.find(x=>x.id==jid); const n = j.assignments.filter(a=>a.status==='approved').length + (d.approve?1:0);
      if (d.approve && n >= j.headcount) await sb.from('jobs').update({status:'full'}).eq('id', +jid);
      toast(d.approve ? `${S(sid).name}님 확정 · 카톡으로 알려주세요` : '거절했어요'); return refresh(); }
    if (d.unassign){ const [jid, sid] = d.unassign.split(':'); if (!confirm(`${S(sid).name}님을 이 일정에서 뺄까요?`)) return;
      const {error} = await sb.from('assignments').update({status:'cancelled', decided_at:new Date().toISOString()}).match({job_id:+jid, staff_id:sid}); if (error) throw error;
      await sb.from('jobs').update({status:'open'}).eq('id', +jid).eq('status','full'); return refresh(); }
    if (d.deljob){ if (!confirm('이 일정을 완전히 지울까요? (취소 표시만 하려면 상태를 [취소]로 저장하세요)')) return;
      const {error} = await sb.from('jobs').delete().eq('id', +d.deljob); if (error) throw error; closeSheet(); toast('지웠어요'); return refresh(); }
    if (d.chk){ await sb.from('reports').update({checked_at:new Date().toISOString()}).eq('id', +d.chk); return refresh(); }
    if (d.delntc){ if (!confirm('공지를 지울까요?')) return; await sb.from('notices').delete().eq('id', +d.delntc); return refresh(); }
    if (d.link){ const s = staff.find(x=>x.id===d.link); copy(linkMsg(s), `${s.name}님 링크 안내문 복사했어요 · 카톡 채널 1:1에 붙여넣으세요`); return; }
    if (d.copyall){ copy(staff.filter(s=>s.status!=='left').map(s=>`${s.name}: ${linkOf(s)}`).join('\n'), '전체 링크 목록 복사했어요 (대표님 보관용)'); return; }
    if (d.addstaff){ staffSheet(); return; }
    if (d.editstaff){ staffSheet(staff.find(s=>s.id===d.editstaff)); return; }
    if (d.newtoken){ if (!confirm('새 링크를 만들면 예전 링크는 바로 막혀요. 계속할까요?')) return;
      const tok = [...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
      const {error} = await sb.from('staff').update({token: tok}).eq('id', d.newtoken); if (error) throw error; closeSheet(); toast('새 링크 발급 완료 · [링크 복사]로 다시 보내주세요'); return refresh(); }
  } catch(err){ fail(err); }
});

document.addEventListener('change', e => {
  const p = e.target.dataset && e.target.dataset.preset;
  if (p){ const inp = document.querySelector(`[name="pay_${p}"]`); if (e.target.value && e.target.value !== 'custom') inp.value = e.target.value; else if (e.target.value === 'custom') inp.focus(); }
});

document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault(); const fid = f.getAttribute('id');
  try {
    if (fid === 'login'){ const v = fd(f); const {error} = await sb.auth.signInWithPassword({email:v.get('email'), password:v.get('password')}); if (error) throw error; return boot(); }
    if (fid === 'jobForm'){ const v = fd(f); const tms = v.getAll('teams'); if (!tms.length){ toast('팀을 하나 이상 골라주세요'); return; }
      const row = { job_date:v.get('job_date'), start_time:nn(v.get('start_time')), title:v.get('title').trim(), kind:nn(v.get('kind')), headcount:+v.get('headcount')||1, teams:tms,
        target_staff: v.getAll('target').length ? v.getAll('target') : null, public_note:nn(v.get('public_note')), address:nn(v.get('address')), private_note:nn(v.get('private_note')),
        order_channel:nn(v.get('order_channel')), collector_id:nn(v.get('collector_id')), total_amount:nnum(v.get('total_amount')), deposit_amount:nnum(v.get('deposit_amount')),
        balance_amount:nnum(v.get('balance_amount')), status:v.get('status'), admin_memo:nn(v.get('admin_memo')) };
      const id = v.get('id');
      const r = id ? await sb.from('jobs').update(row).eq('id', +id).select().single() : await sb.from('jobs').insert(row).select().single();
      if (r.error) throw r.error; closeSheet();
      if (!id){ copy(jobMsg(r.data), '올렸어요 · 카톡 알림 문구가 복사됐어요'); } else toast('저장했어요');
      return refresh(); }
    if (fid === 'payForm'){ const v = fd(f); const id = +v.get('id'); const j = jobs.find(x=>x.id===id);
      for (const a of j.assignments.filter(a=>a.status==='approved')){
        const {error} = await sb.from('assignments').update({pay_amount:nnum(v.get('pay_'+a.staff_id)), extra_amount:nnum(v.get('extra_'+a.staff_id)), pay_memo:nn(v.get('memo_'+a.staff_id))}).match({job_id:id, staff_id:a.staff_id});
        if (error) throw error; }
      const {error} = await sb.from('jobs').update({status:'done'}).eq('id', id); if (error) throw error;
      closeSheet(); toast('마감 저장 · 직원들이 자기 금액을 볼 수 있어요'); return refresh(); }
    if (fid === 'staffForm'){ const v = fd(f);
      const row = { name:v.get('name').trim(), team:v.get('team'), role:nn(v.get('role')), phone:nn(v.get('phone')), partner_area:nn(v.get('partner_area')),
        pay_type:v.get('pay_type'), status:v.get('status'), joined_on:nn(v.get('joined_on')), can_collect: v.get('can_collect')==='on' };
      const id = v.get('id'); const r = id ? await sb.from('staff').update(row).eq('id', id) : await sb.from('staff').insert(row);
      if (r.error) throw r.error; closeSheet(); toast('저장했어요'); return refresh(); }
    if (fid === 'assignForm'){ const v = fd(f); const id = +v.get('id'); const ids = v.getAll('s'); if (!ids.length) return closeSheet();
      const now = new Date().toISOString();
      const {error} = await sb.from('assignments').upsert(ids.map(s=>({job_id:id, staff_id:s, status:'approved', decided_at:now})), {onConflict:'job_id,staff_id'}); if (error) throw error;
      const j = jobs.find(x=>x.id===id); const n = new Set([...j.assignments.filter(a=>a.status==='approved').map(a=>a.staff_id), ...ids]).size;
      if (n >= j.headcount) await sb.from('jobs').update({status:'full'}).eq('id', id);
      closeSheet(); toast('배정했어요'); return refresh(); }
    if (fid === 'ntcForm'){ const v = fd(f);
      const {error} = await sb.from('notices').insert({title:nn(v.get('title')), body:v.get('body'), team:nn(v.get('team')), important:v.get('important')==='on'}); if (error) throw error;
      copy(`[${C.BRAND}] 새 공지가 있어요. 일정판 [공지]에서 확인해주세요.`, '공지 올림 · 카톡 알림 문구 복사됐어요'); return refresh(); }
  } catch(err){ fail(err); }
});

/* ---------- boot ---------- */
function loginView(msg){
  $('#root').innerHTML = `<form class="login" id="login"><img class="logo" src="logo.svg" alt="" style="width:44px;height:44px"><h1>HQS 로그인</h1><p>${esc(C.BRAND)} 본사 관리 화면</p>
    ${msg?`<p style="color:var(--warn)">${esc(msg)}</p>`:''}
    <div class="field"><label>이메일</label><input type="email" name="email" autocomplete="username" required></div>
    <div class="field"><label>비밀번호</label><input type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">로그인</button></form>`;
}
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return loginView();
  const {data:isAdmin, error} = await sb.rpc('is_admin');
  if (error || !isAdmin){ await sb.auth.signOut(); return loginView('관리자 계정이 아니에요'); }
  await refresh();
  setInterval(() => { if (document.visibilityState === 'visible' && !$('#scrim').classList.contains('on')) refresh(); }, 60000);
}
boot().catch(fail);
})();
</script>
