<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5B21B6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매물노트">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>RITZ 매물노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — left rail on desktop, bottom tab bar + raised center add button on phone. Light by default, night-purple when the phone is in dark mode. */
:root{
  --bg:#F6F4FA; --surface:#FFFFFF; --sunk:#EFEBF6; --line:#DED8EB;
  --ink:#17132A; --ink-2:#4A4560; --ink-3:#6B6680;
  --accent:#6D28D9; --accent-2:#7C3AED; --accent-soft:#EDE9FE; --on-accent:#FFFFFF;
  --hero-a:#5B21B6; --hero-b:#2E1065; --hero-line:#5B21B6; --hero-sub:#DDD6FE; --hero-ink:#FFFFFF; --hero-track:#1E0B45;
  --rail:#FFFFFF; --rail-ink:#4A4560; --rail-active:#17132A; --hover:#F2EFF8; --current:#EDE9FE; --glow-o:.10;
  --ok:#047857; --ok-soft:#E2F2EA; --warn:#A15C07; --warn-soft:#FEF3C7; --bad:#C2410C; --bad-soft:#FFF1E8; --bad-line:#FCCFB0;
  --wolse:#0284C7; --wolse-soft:#E0F2FE; --jeonse:#CA8A04; --jeonse-soft:#FEF6CC; --maemae:#EA580C; --maemae-soft:#FFEDD5; --dangi:#0D9488; --dangi-soft:#CCFBF1;
  --lock:#BE123C; --lock-soft:#FFF1F3;
  --shadow:0 1px 2px rgba(23,19,42,.05),0 10px 28px -14px rgba(23,19,42,.22);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --bg:#0D0A16; --surface:#16121F; --sunk:#1E1829; --line:#2B2440;
  --ink:#F1EEF8; --ink-2:#B8B0CC; --ink-3:#7D7594;
  --accent:#A78BFA; --accent-2:#C4B5FD; --accent-soft:#2A1F45; --on-accent:#120A24;
  --hero-a:#3B1D7A; --hero-b:#150E26; --hero-line:#4C2A94; --hero-sub:#CDBEFB;
  --rail:#09070F; --rail-ink:#958CAB; --rail-active:#FFFFFF;
  --ok:#34D399; --ok-soft:#12302A; --warn:#FBBF5A; --warn-soft:#33270F; --bad:#FB923C; --bad-soft:#2E1A10; --bad-line:#5A2E17;
  --wolse:#7DD3FC; --wolse-soft:#0F2836; --jeonse:#FDE047; --jeonse-soft:#2E2A0E; --maemae:#FB923C; --maemae-soft:#33200F; --dangi:#5EEAD4; --dangi-soft:#0F2E2B;
  --lock:#FB7190; --lock-soft:#2A1219;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
    --hero-ink:#F1EEF8; --hero-track:#0D0A16; --hover:rgba(255,255,255,.06); --current:rgba(255,255,255,.1); --glow-o:.18;
  color-scheme:dark}}
:root[data-theme="dark"]{

  --bg:#0D0A16; --surface:#16121F; --sunk:#1E1829; --line:#2B2440;
  --ink:#F1EEF8; --ink-2:#B8B0CC; --ink-3:#7D7594;
  --accent:#A78BFA; --accent-2:#C4B5FD; --accent-soft:#2A1F45; --on-accent:#120A24;
  --hero-a:#3B1D7A; --hero-b:#150E26; --hero-line:#4C2A94; --hero-sub:#CDBEFB;
  --rail:#09070F; --rail-ink:#958CAB; --rail-active:#FFFFFF;
  --ok:#34D399; --ok-soft:#12302A; --warn:#FBBF5A; --warn-soft:#33270F; --bad:#FB923C; --bad-soft:#2E1A10; --bad-line:#5A2E17;
  --wolse:#7DD3FC; --wolse-soft:#0F2836; --jeonse:#FDE047; --jeonse-soft:#2E2A0E; --maemae:#FB923C; --maemae-soft:#33200F; --dangi:#5EEAD4; --dangi-soft:#0F2E2B;
  --lock:#FB7190; --lock-soft:#2A1219;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
    --hero-ink:#F1EEF8; --hero-track:#0D0A16; --hover:rgba(255,255,255,.06); --current:rgba(255,255,255,.1); --glow-o:.18;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);border-right:1px solid var(--line);color:var(--rail-ink);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.mark{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:15px;letter-spacing:-.04em}
.brand b{display:block;color:var(--rail-active);font-size:15px;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;letter-spacing:.14em;color:var(--rail-ink);opacity:.7}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--rail-ink);text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--hover);color:var(--rail-active)}
.nav[aria-current="true"]{background:var(--current);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--sunk);padding:1px 8px;border-radius:99px}
.rail .add{margin-top:14px;background:var(--accent);color:var(--on-accent);justify-content:center;font-weight:600;box-shadow:0 10px 28px -10px var(--accent)}
.rail .add:hover{background:var(--accent-2);color:var(--on-accent)}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--sunk)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.who .avatar{background:var(--accent);color:var(--on-accent)}
.who b{display:block;color:var(--rail-active);font-size:13px}
.who small{font-size:11px}

main{position:relative;overflow:hidden;min-width:0;padding-block:28px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{position:relative;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.glow{position:absolute;top:-160px;right:-120px;width:420px;height:420px;border-radius:50%;background:var(--accent);opacity:var(--glow-o);filter:blur(90px);pointer-events:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{margin:4px 0 0;font-size:26px;letter-spacing:-.03em;line-height:1.2;text-wrap:balance}
h2{margin:0;font-size:15px;letter-spacing:-.01em}
.demo{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.muted{color:var(--ink-3)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}

/* KPI */
.kpis{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.kpi.hero{gap:14px;padding:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-align:left}
button.kpi:hover{border-color:var(--accent-2)}
.kpi .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1}
.kpi .v small{font-size:13px;color:var(--ink-3);font-family:var(--f-body);margin-left:2px}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi.hero{background:linear-gradient(150deg,var(--hero-a),var(--hero-b));border-color:var(--hero-line);color:var(--hero-ink)}
.kpi.hero .l,.kpi.hero .s,.kpi.hero .v small{color:var(--hero-sub)}
.kpi.hero .v{font-size:52px}
.kpi.hero .track{background:var(--hero-track);height:8px}
.kpi.hero .mix{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--hero-sub)}
.kpi.hero .mix b{font-family:var(--f-num);font-weight:600;color:var(--hero-ink)}
.kpi.alert{background:var(--bad-soft);border-color:var(--bad-line)}
.kpi.alert .v{color:var(--bad)}
.kpi.alert .l,.kpi.alert .s{color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:76px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.bar .n{text-align:right;color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:14px}
.legend span{display:flex;gap:6px;align-items:center}
.people{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0;padding-top:0}
.person b{display:block;font-size:13.5px}
.person small{color:var(--ink-3);font-size:12px}
.pill-n{font-size:20px;font-weight:600}

/* search */
.searchbox{display:flex;align-items:center;gap:10px;background:var(--sunk);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.searchbox:focus-within{border-color:var(--accent-2)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;padding:10px 0}
.searchbox .clear{border:0;background:var(--sunk);border-radius:10px;padding:8px 12px;color:var(--ink-2);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.chip:hover{border-color:var(--accent-2);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chiprow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.chiprow>span{font-size:11px;letter-spacing:.12em;color:var(--ink-3);width:52px;flex:none;font-weight:600}
.hint{font-size:12.5px;color:var(--ink-3)}
.hint code{font-family:var(--f-num);background:var(--sunk);padding:1px 6px;border-radius:6px;color:var(--ink-2)}
.resbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.resbar select,.seg{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px}
.seg{display:inline-flex;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* listing cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent-2)}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.t-월세{background:var(--wolse-soft);color:var(--wolse)}.t-전세{background:var(--jeonse-soft);color:var(--jeonse)}.t-매매{background:var(--maemae-soft);color:var(--maemae)}.t-단기{background:var(--dangi-soft);color:var(--dangi)}
.s-진행{background:var(--ok-soft);color:var(--ok)}.s-휴직{background:#EDE9FE;color:#7C3AED}
.bossbar{display:flex;gap:8px;align-items:center;border-radius:12px;padding:9px 13px;font-size:13.5px;margin:0 0 14px;background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA}.bossbar.busy{background:#FEF2F2;color:#991B1B;border-color:#FECACA}
.schedbtn{display:inline-flex;align-items:center;gap:6px}
.statusrow{display:flex;justify-content:flex-end;margin:0 0 -8px}
.hqback{display:flex;margin:0 0 10px}.hqback a{font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.greet{flex:1 1 320px;min-width:0}.hline{display:flex;align-items:center;justify-content:space-between;gap:12px}@media (min-width:900px){.hline{justify-content:flex-start;gap:16px}}.hline h1{min-width:0;word-break:keep-all}.hline h1 .nm{display:block}.hl{display:flex;align-items:center;gap:12px;min-width:0}.cheer{word-break:keep-all}
.cheer{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.evp{margin:0 0 16px}.evp .panel-h{margin-bottom:8px}.evp h2 small{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:6px}
.evrow{display:grid;grid-template-columns:78px auto 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.evrow:first-of-type{border-top:0}.evrow .d{font-size:13px;line-height:1.25}.evrow .d b{display:block;font-size:14px;white-space:nowrap}.evrow .d small{color:var(--ink-3)}
.evrow .d.today b{color:var(--accent)}.evk{font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.k-계약{background:var(--accent-soft);color:var(--accent)}.k-잔금{background:var(--warn-soft);color:var(--warn)}.k-안내{background:var(--wolse-soft);color:var(--wolse)}.k-기타{background:var(--sunk);color:var(--ink-2)}
.evrow .t{min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.evrow .t .mm{font-size:12px;color:var(--ink-3);margin-right:6px}
.evp .more{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}.evp .more a{color:var(--accent);text-decoration:none;font-weight:600}.s-보류{background:var(--warn-soft);color:var(--warn)}.s-계약완료{background:var(--sunk);color:var(--ink-3)}
.card .id{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.who2{display:flex;align-items:center;gap:8px}.who2 .mid .ko{font-style:normal;font-weight:900;-webkit-text-stroke:.45px currentColor;font-size:.8em;display:inline-block;transform:translateY(-.18em);margin:0 .03em}.who2 .mid{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:800;letter-spacing:0;line-height:1;color:var(--ink)}.tags2{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.price{font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.price small{font-size:12px;color:var(--ink-3);font-family:var(--f-body);font-weight:500;margin-left:4px}
.place{font-size:14px;font-weight:600}
.place span{color:var(--ink-3);font-weight:400}
.specs{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.specs span{display:flex;gap:4px;align-items:center}
.feat{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px;font-size:12px;color:var(--ink-3)}
.card-foot .avatar{width:24px;height:24px;font-size:11px}
.card-foot .stale{margin-left:auto;color:var(--bad);font-weight:600}
.card-foot .fresh{margin-left:auto}
.card.mine{border-left:3px solid var(--accent-2)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent-2);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary{font-weight:600;box-shadow:0 8px 22px -12px var(--accent)}
.btn.primary:hover{background:var(--accent-2);color:var(--on-accent)}
.btn svg.i{width:16px;height:16px}
.empty{text-align:center;padding:48px 16px;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* sheet / drawer */
.scrim{position:fixed;inset:0;background:rgba(2,6,4,.7);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:16px;animation:slide .22s ease-out}
.sheet>*{flex-shrink:0}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{font-size:18px}
.x{margin-left:auto;border:0;background:var(--sunk);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dl div{background:var(--surface);padding:10px 12px;min-width:0}
.dl dt{font-size:11.5px;color:var(--ink-3)}
.dl dd{margin:2px 0 0;font-weight:500;word-break:break-word}
.dl .full{grid-column:1/-1}
.lockbox{border:1px solid var(--lock);background:var(--lock-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lockbox h3{margin:0;font-size:13px;color:var(--lock);display:flex;gap:6px;align-items:center}
.lockbox .dl{border-color:transparent}
.contact{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center}

/* form */
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
legend{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink-2);padding:0 6px}
fieldset.priv{border-color:var(--lock);background:var(--lock-soft)}
fieldset.priv legend{color:var(--lock)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:15px;width:100%;min-width:0}
.f textarea{min-height:68px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.f .aux{font-size:11.5px;color:var(--ink-3)}
.seg-in{display:flex;gap:6px;flex-wrap:wrap}

function viewFind(live){
  const res=sorted(search(live,S.q));
  const qTok=new Set(S.q.split(/\s+/).filter(Boolean));
  const chipRow=(label,list)=>`<div class="chiprow"><span>${label}</span><div class="chips">${list.map(v=>`<button class="chip" data-tok="${v}" aria-pressed="${qTok.has(v)}">${v}</button>`).join('')}</div></div>`;
  return `
  <div class="top"><div><div class="eyebrow">전체 매물</div><h1>매물 찾기</h1></div></div>
  <div class="searchbox">${ic('search')}<input id="q" type="search" placeholder="양정 원룸 보증금 500" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search">${S.q?'<button class="clear" data-clear>지우기</button>':''}</div>
  <div class="hint">단어를 띄어 쓰면 모두 맞는 매물만 나와요. 금액은 <code>보증금 500</code> → ${S.data.units.big}만원 단위(500~${500+S.data.units.big-1}), <code>월세 40</code> → ${S.data.units.small}만원 단위로 찾아요.</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    ${chipRow('구',[...new Set(live.map(r=>r.gu).filter(Boolean))].sort((a,b)=>(GUS.indexOf(a)+1||99)-(GUS.indexOf(b)+1||99)))}
    ${chipRow('종류',TYPES)}
    ${chipRow('거래',DEALS)}
  </div>
  <div class="resbar"><b><span class="num">${res.length}</span>건${S.q?` <span class="muted" style="font-weight:400">· "${esc(S.q)}"</span>`:''}</b>
    <select id="sort" aria-label="정렬"><option value="new" ${S.sort==='new'?'selected':''}>최신 등록순</option><option value="low" ${S.sort==='low'?'selected':''}>금액 낮은순</option><option value="high" ${S.sort==='high'?'selected':''}>금액 높은순</option></select></div>
  ${res.length?`<div class="cards">${res.map(card).join('')}</div>`:emptyBox('조건에 맞는 매물이 없어요','단어를 하나 빼거나 금액을 바꿔 보세요.')}`;
}

function viewMine(mine){
  const f=S.mineFilter;
  let rows=mine;
  if(f==='확인 필요') rows=mine.filter(r=>r.status==='진행'&&(daysAgo(r.checked)??999)>30);
  else if(f!=='전체') rows=mine.filter(r=>r.status===f);
  rows=sorted(rows);
  const opts=['진행','보류','계약완료','확인 필요','전체'];
  return `
  <div class="top"><div><div class="eyebrow">${esc(S.data.me.name)}</div><h1>내 매물</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-bulk>${ic('folder')}한꺼번에 등록</button><button class="btn" data-export="${esc(f)}">${ic('check')}광고용 엑셀 받기</button><button class="btn primary" data-new>${ic('plus')}매물 등록</button></div></div>
  <div class="seg" role="group" aria-label="상태">${opts.map(o=>`<button data-mf="${o}" aria-pressed="${f===o}">${o} <span class="num muted">${o==='전체'?mine.length:o==='확인 필요'?mine.filter(r=>r.status==='진행'&&(daysAgo(r.checked)??999)>30).length:mine.filter(r=>r.status===o).length}</span></button>`).join('')}</div>
  ${rows.length?`<div class="cards">${rows.map(r=>card(r,true)).join('')}</div>`:emptyBox(f==='확인 필요'?'확인이 밀린 매물이 없어요':'해당하는 매물이 없어요',f==='확인 필요'?'모든 진행 매물을 30일 안에 확인했어요.':'매물 등록 버튼으로 새 매물을 추가하세요.')}`;
}

function midH(id){return esc(id).replace(/([가-힣])/g,'<i class="ko">$1</i>')}
function card(r,withActions){
  const age=daysAgo(r.checked),stale=r.status==='진행'&&(age??999)>30,mine=isMine(r);
  const ph=photoInfo(r.photo).ids[0];
  return `<article class="card ${mine?'mine':''}" data-open="${esc(r.id)}" tabindex="0" role="button" aria-label="${esc(r.id)} 자세히 보기">${ph?`<img class="card-ph" src="${thumb(ph,600)}" alt="" loading="lazy">`:''}
    <div class="card-top"><span class="who2" title="담당 ${esc(r.agent)}">${EPProfile.av(r.agent,30)}<b class="mid">${midH(r.id)}</b></span><span class="tags2"><span class="tag t-${esc(r.deal)}">${esc(r.deal||'-')}</span><span class="tag">${esc((r.type==='상가'&&r.subType)||r.type||'-')}</span>${r.status!=='진행'?`<span class="tag s-${esc(r.status)}">${esc(r.status)}</span>`:''}</span></div>
    <div><div class="price">${priceLine(r)}</div>${num(r.fee)!=null?`<div class="muted" style="font-size:12px">관리비 <span class="num">${fmt(num(r.fee))}</span>만원</div>`:''}</div>
    <div class="place">${esc(r.gu)} ${esc(r.dong)} <span>${esc(r.loc)}</span></div>
    <div class="specs">${r.rooms!==''?`<span>방 <span class="num">${esc(r.rooms)}</span>${r.baths!==''?` · 욕실 <span class="num">${esc(r.baths)}</span>`:''}</span>`:''}${r.floor!==''?`<span>${ic('floor')}<span class="num">${esc(r.floor)}</span>${r.totalFloor!==''?`/<span class="num">${esc(r.totalFloor)}</span>`:''}층</span>`:''}${r.area!==''?`<span>${ic('area')}<span class="num">${esc(r.area)}</span>㎡ · <span class="num">${pyeong(r.area)}</span>평</span>`:''}${r.moveIn?`<span>${ic('cal')}${esc(r.moveIn)}</span>`:''}</div>
    ${r.feature?`<div class="feat">${esc(r.feature)}</div>`:''}
    <div class="card-foot">담당 ${esc(r.agent)}${stale?`<span class="stale">${age>900?'확인 기록 없음':age+'일 전 확인'}</span>`:`<span class="fresh">${r.checked?short(r.checked)+' 확인':''}</span>`}</div>
    ${withActions?`<div class="actions"><button class="btn" data-check="${esc(r.id)}">${ic('check')}오늘 확인</button><button class="btn" data-edit="${esc(r.id)}">${ic('edit')}수정</button></div>`:''}
  </article>`;
}
const emptyBox=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`;

  return `<div class="scrim" data-close><section class="sheet" role="dialog" aria-modal="true" aria-label="매물 상세">

    <div><div class="price" style="font-size:28px">${priceLine(r)}</div><div class="place" style="margin-top:6px">${esc(r.gu)} ${esc(r.dong)} <span>${esc(r.loc)}</span></div></div>
    <dl class="dl" style="margin:0">
      ${row('종류',esc(r.type+(r.subType?' · '+r.subType:'')))}${row('층',r.floor!==''?`<span class="num">${esc(r.floor)}</span>층${r.totalFloor!==''?` / 전체 <span class="num">${esc(r.totalFloor)}</span>층`:''}`:'')}
      ${r.rooms!==''||r.baths!==''?row('방 수',r.rooms!==''?`<span class="num">${esc(r.rooms)}</span>개`:'')+row('욕실 수',r.baths!==''?`<span class="num">${esc(r.baths)}</span>개`:''):''}
      ${r.roomShape||r.duplex?row('방 형태',esc([r.roomShape,r.duplex].filter(Boolean).join(' · '))):''}
      ${row('엘리베이터',esc(r.elevator))}${row('주차',esc(r.parking)+(r.parkCount!==''?` (<span class="num">${esc(r.parkCount)}</span>대)`:''))}${r.direction?row('방향',esc([r.dirBase&&r.dirBase+' 기준',r.direction].filter(Boolean).join(' '))):''}
      ${row('관리비',esc([r.feeType,r.feeTier,r.feeBasis].filter(Boolean).join(' · '))+(num(r.fee)!=null?`<br><span class="num">${fmt(num(r.fee))}</span>만원`:'')+(r.feeItems?`<br><span class="muted">${esc(r.feeItems)}</span>`:''),1)}
      ${r.loan?row('융자금',esc(r.loan)):''}${r.buildUse?row('건축물 용도',esc(r.buildUse)):''}${r.supplyArea!==''?row('공급면적',`<span class="num">${esc(r.supplyArea)}</span>㎡`):''}${r.approvalDate?row('사용승인일',esc(r.approvalDate)):''}
      ${r.title?row('제목',esc(r.title),1):''}
      ${row('전용면적',r.area!==''?`<span class="num">${esc(r.area)}</span>㎡ (<span class="num">${pyeong(r.area)}</span>평)`:'')}${row('입주가능일',esc(r.moveIn))}
      ${row('매매가',num(r.sale)!=null?`<span class="num">${won(num(r.sale))}</span>만원`:'')}${row('보증금·전세금',num(r.deposit)!=null?`<span class="num">${won(num(r.deposit))}</span>만원`:'')}
      ${row('월세',num(r.rent)!=null?`<span class="num">${fmt(num(r.rent))}</span>만원`:'')}
      ${row('특징',esc(r.feature),1)}${row('공유 메모',esc(r.memo),1)}
      ${(()=>{const p=photoInfo(r.photo);return row('사진',p.ids.length?`<div class="ph-grid">${p.ids.map(id=>`<a class="ph" href="https:\/\/drive.google.com\/file\/d\/${esc(id)}\/view" target="_blank" rel="noopener"><img src="${thumb(id)}" alt="" loading="lazy"></a>`).join('')}</div>`:p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">사진 폴더 열기</a>`:'',1)})()}

    :`<div class="contact">${ic('user')}<div>이 매물은 <b>${esc(r.agent)}</b> 담당이에요. 매물번호 <b class="num">${esc(r.id)}</b>로 공동중개를 요청하세요.</div></div>`}

  if(g('관리비 실비근거'))memo.push('관리비: '+g('관리비 실비근거'));if(g('관리비 확인불가 사유'))memo.push('관리비 확인불가: '+g('관리비 확인불가 사유'));

function toDanggeun(r){const loc=splitGu(r.gu);const inv=o=>Object.fromEntries(Object.entries(o).map(([a,b])=>[b,a]));

      const fr=RULES.find(r=>r.k==='feeAmt'),fc=RULES.find(r=>r.k==='feeChk');
      rec.feeItems=shown(fr)?Object.entries(amt).map(([k,x])=>k+' '+x).join(', '):shown(fc)?fd.getAll('feeChk').join(', '):'';
      if(shown(fr))rec.fee=String(Math.round(Object.values(amt).reduce((a,b)=>a+(+b||0),0)*10)/10);
      S.edit=rec;S.busy=true;render();
      try{S.data=await call('saveListing',rec);S.edit=null;S.busy=false;toast(rec.id?'저장했어요':'등록했어요. 다른 직원 화면에는 1분 안에 보여요')}
      catch(x){S.busy=false;render();const er=document.getElementById('ferr');er.textContent='저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. ('+(x&&x.message||x)+')';er.hidden=false}
    };
  }
}
