<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16347A">
<title>리츠 영업파트너</title>
<link rel="icon" href="../logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../style.css?v=1109b">
<style>
body{background:#F6F4EF}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:18px 18px 54px}
.top .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900;letter-spacing:.5px}
.top .row b{color:#F68B1F}.top .row span{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px;letter-spacing:0}
.top h1{margin:14px 0 2px;font-size:21px;font-weight:900}.top p{margin:0;font-size:13px;opacity:.85}
.sum{margin:-40px 14px 0;background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(22,52,122,.12)}
.sum small{font-size:12.5px;color:var(--sub);font-weight:700}.sum .big{font-size:28px;font-weight:900;color:var(--navy);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.sum .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.sum .g div{background:#F6F4EF;border-radius:10px;padding:8px 10px}.sum .g span{display:block;font-size:11px;color:var(--sub);font-weight:700}.sum .g b{font-size:16px;font-weight:900}
.body{flex:1;padding:14px 14px 100px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:14px 0 4px;border:0;border-radius:16px;background:#F68B1F;color:#fff;font:inherit;font-size:18px;font-weight:900;padding:17px}
.notice{background:#E8EDF8;color:var(--navy);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;white-space:pre-line;margin:12px 0 0}
h2{font-size:15px;font-weight:900;margin:18px 2px 8px}
.it{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:8px}
.it .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.it .h b{font-size:15px}.it .s{font-size:12px;color:var(--sub);margin-top:2px}
.st{font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:20px;white-space:nowrap}
.st.new{background:#E7E9EE;color:#3F4859}.st.contact{background:#FFEBD6;color:#9A4A00}.st.won{background:var(--navy);color:#fff}.st.lost{background:#F1F2F4;color:#6B7280}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}.bar i{height:6px;border-radius:3px;background:#E3E1DB}.bar i.on{background:var(--navy)}
.lb{display:grid;grid-template-columns:repeat(4,1fr);font-size:10.5px;color:var(--sub);margin-top:4px;font-weight:700}
.note2{font-size:12px;color:#3F4859;font-weight:700;margin-top:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;color:var(--mute);font-weight:700;min-height:46px;justify-content:center}
.tabs button[aria-current=true]{color:var(--navy);font-weight:900}.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.f label.t{display:block;font-size:13px;font-weight:900;margin:12px 0 6px}
.f input,.f textarea{width:100%;box-sizing:border-box;border:1.5px solid #D5D2CA;border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;background:#fff}
.f textarea{min-height:70px;resize:vertical}
.kc{display:flex;flex-wrap:wrap;gap:8px}.kc label{cursor:pointer}.kc input{position:absolute;opacity:0;pointer-events:none}
.kc span{display:inline-flex;min-height:38px;align-items:center;padding:0 14px;border-radius:20px;border:1.5px solid #D5D2CA;background:#fff;font-size:13.5px;font-weight:700}
.kc input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.agree{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:700;margin-top:14px}
.agree input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--navy);flex:none}
.box2{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
.link{display:flex;gap:8px;align-items:center}.link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#F6F4EF;border-radius:10px;padding:11px;font-size:13px;font-family:inherit}
.copy{border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:900;font-size:14px;padding:0 16px;min-height:44px}
.msg{background:#F6F4EF;border-radius:10px;padding:12px;font-size:13px;line-height:1.6;white-space:pre-line;color:#3F4859;margin:8px 0}
.mrow{display:flex;justify-content:space-between;font-size:13px;color:#3F4859;padding:2px 0}.mrow.t{font-size:15px;font-weight:900;color:var(--ink);border-top:1px solid #EEECE6;margin-top:6px;padding-top:8px}.mrow.t b{color:#E07B10}
.rooms{display:flex;gap:8px;margin-bottom:10px}.rooms button{flex:1;border:1.5px solid #D5D2CA;background:#fff;border-radius:12px;min-height:46px;font:inherit;font-size:14px;font-weight:900;position:relative}
.rooms button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.dot{position:absolute;top:-6px;right:-4px;background:#E11D48;color:#fff;border-radius:999px;font-size:11px;font-weight:900;padding:1px 7px}
.th{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.mm{max-width:82%;align-self:flex-start}.mm.me{align-self:flex-end;text-align:right}
.mm .b{display:inline-block;text-align:left;background:#fff;border-radius:14px;padding:10px 13px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.mm.hq .b{border:1px solid #E3E1DB}.mm.me .b{background:var(--navy);color:#fff}
.mm small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.send{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;gap:8px;padding:8px 12px;background:#F6F4EF}
.send textarea{flex:1;min-height:44px;max-height:120px;border:1.5px solid #D5D2CA;border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;resize:none}
.send button{border:0;border-radius:12px;background:#F68B1F;color:#fff;font:inherit;font-weight:900;padding:0 16px}
.tabs button{position:relative}.tabs .dot{top:2px;right:18%}
.deal{background:#FFF4E8;border:1.5px solid #F68B1F;border-radius:16px;padding:14px;margin-top:10px}.deal .dh{font-size:15px;font-weight:900;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.deal .dh b{color:#F68B1F;font-size:20px}.deal .dh span{font-size:12px;color:var(--sub);font-weight:700}.deal .dd{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.deal .dd i{font-style:normal;background:#fff;border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:700}
.hcard{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:0;border-radius:14px;padding:14px;margin-top:10px;font:inherit;font-size:14px;font-weight:900;text-align:left}
.hcard span{font-size:12px;color:var(--sub);font-weight:700}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ka{display:block;border:0;border-radius:14px;background:#fff;padding:0 0 10px;overflow:hidden;font:inherit;text-align:left;cursor:pointer}
.ka img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#E9E6DF}.ka b{display:block;font-size:13.5px;padding:8px 10px 0}.ka span{font-size:11.5px;color:var(--sub);padding:0 10px}
.kf{margin:12px 0 0;position:relative}.kf img{width:100%;border-radius:14px;display:block;background:#E9E6DF}
.kf figcaption{position:absolute;top:10px;left:10px;font-size:12px;font-weight:900;color:#fff;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:20px}.kf figcaption.after{background:#F68B1F}
.err{max-width:420px;margin:80px auto;text-align:center;padding:20px;color:var(--sub)}
</style>
<script src="../thumb.js?v=1109b"></script>
</head>
<body>
<div class="app" id="app"><div class="spin"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="../config.js?v=1109b"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
const C = window.EP_CONFIG, sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
const K = new URLSearchParams(location.search).get('k') || '';
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => n == null ? '-' : Number(n).toLocaleString('ko-KR');
const man = n => { n = +n||0; return n >= 10000 ? (Math.round(n/1000)/10).toLocaleString('ko-KR') + '만' : won(n); };
const md = s => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('on'), 2600); };
const copy = async (t, m) => { try { await navigator.clipboard.writeText(t); toast(m||'복사했어요'); } catch(_) { prompt('복사해서 쓰세요', t); } };
const ST = {new:'접수됨', contact:'리츠 연락 중', won:'계약 성사', lost:'불발'};
const STEP = {new:1, contact:2, won:3, lost:0};
const KINDS = ['준공·인테리어 후','상가·사무실 정기','입주·이사','외국계 사무실','잘 모르겠어요'];
const ICON = {home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>', money:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>', kit:'<path d="M4 4h16v16H4z"/><path d="M4 15l4-4 4 4 3-3 5 5"/>'};
ICON.chat = '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>';
const TABS = [['home','홈'],['add','소개하기'],['list','내 소개'],['chat','대화'],['money','내 돈']];
let D = null, tab = 'home', room = 'notice', MSG = [], UN = {notice:0, dm:0}, KIT = null, ALB = null, DEAL = null;
const DW = ['일','월','화','수','목','금','토'];
const dealList = () => (DEAL && DEAL.days || []).map(x => { const [y,m,d] = x.d.split('-').map(Number); return `${m}/${d}(${DW[x.dow]}) ${x.am&&x.pm?'종일':x.am?'오전':'오후'}`; });
const PURL = (path, bucket) => `${C.SUPABASE_URL}/storage/v1/object/public/${bucket||'live'}/${path}`;
const STG = {before:'작업 전', during:'작업 중', after:'작업 후'};
async function loadKit(){ const r = await sb.rpc('partner_kit', {p_token: K}); KIT = r.error ? [] : (r.data || []); if (tab === 'kit') render(); }

async function load(){
  if (!K) return fail('링크가 맞지 않아요. 받은 카톡 링크로 다시 들어와 주세요.');
  const r = await sb.rpc('partner_me', {p_token: K});
  if (r.error) return fail(/bad_token/.test(r.error.message) ? '링크가 맞지 않거나 사용이 끝났어요. 리츠종합클린(010-7193-2246)에 문의해 주세요.' : '불러오지 못했어요. 잠시 뒤 다시 열어 주세요.');
  D = r.data;
  try { const u = await sb.rpc('partner_unread', {p_token: K}); if (!u.error && u.data) UN = u.data; } catch(_){}
  // 1108: 빈 날 특가 없앰 (대표님 결정) — 안 불러옴
  render();
}
async function loadChat(){ const r = await sb.rpc('partner_chat', {p_token: K, p_room: room});
  if (r.error) { MSG = null; } else { MSG = r.data || []; UN[room] = 0; }
  if (tab === 'chat') { render(); const e = document.scrollingElement; e.scrollTop = e.scrollHeight; } }
const hm = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
async function savePhotos(id, btn){ const a = (KIT||[]).find(x => x.id === id); if (!a) return; btn.disabled = true; const t0 = btn.textContent; btn.textContent = '사진 준비 중…';
  try {
    const files = await Promise.all(a.photos.map(async (p, i) => { const b = await (await fetch(PURL(p.path, p.bucket))).blob(); return new File([b], `리츠_${i+1}_${STG[p.stage]||'사진'}.jpg`, {type: 'image/jpeg'}); }));
    if (navigator.canShare && navigator.canShare({files})) { await navigator.share({files}); }
    else { files.forEach(f => { const u = URL.createObjectURL(f), l = document.createElement('a'); l.href = u; l.download = f.name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }); toast('사진을 저장했어요'); }
  } catch (e) { if (e && e.name !== 'AbortError') toast('저장하지 못했어요 · 사진을 길게 눌러 저장해 주세요'); }
  btn.disabled = false; btn.textContent = t0; }
function fail(m){ $('#app').innerHTML = `<div class="err"><b style="font-size:17px;color:var(--ink)">리츠 영업파트너</b><p>${esc(m)}</p></div>`; }
const money = () => { const P = D.pays||[]; const earned = P.reduce((a,x)=>a+(x.pay||0),0), got = P.filter(x=>x.paid_on).reduce((a,x)=>a+(x.pay||0),0); return {earned, got, left: earned-got}; };
const refCard = r => `<div class="it"><div class="h"><div><b>${esc(r.customer)}</b><div class="s">${esc([r.kind, r.area].filter(Boolean).join(' · '))} · ${md(r.created_at)} 접수${r.source==='link'?' · 소개 링크':''}</div></div><span class="st ${r.status}">${r.recurring&&r.status==='won'?'정기 계약':ST[r.status]}</span></div>
  ${r.status!=='lost' ? `<div class="bar">${[1,2,3,4].map(i=>`<i class="${STEP[r.status]>=i?'on':''}"></i>`).join('')}</div><div class="lb"><span>접수</span><span>리츠 연락</span><span>계약 성사</span><span>수수료</span></div>` : ''}
  ${r.dup ? '<div class="note2" style="color:#92400E">같은 연락처로 먼저 들어온 소개가 있어 확인 중이에요</div>' : ''}
  ${r.note ? `<div class="note2">리츠 메모 · ${esc(r.note)}</div>` : ''}${r.status==='lost'&&r.lost_reason ? `<div class="note2">사유 · ${esc(r.lost_reason)}</div>` : ''}</div>`;

const V = {
  home(){ const m = money(), refs = D.refs||[], ing = refs.filter(r=>r.status==='new'||r.status==='contact');
    return `<div class="top"><div class="row"><span style="background:none;padding:0;font-size:13px;font-weight:900"><b>RITZ</b> 영업파트너</span><span>${D.me.kind==='sales'?'전담 영업':'소개형'}</span></div><h1>${esc(D.me.name)} 파트너님, 반가워요</h1><p>아는 사장님 한 분이 오늘의 첫 수입이에요</p></div>
      <div class="sum"><small>받을 수수료</small><div class="big">${won(m.left)}원</div><div class="g"><div><span>진행 중</span><b>${ing.length}건</b></div><div><span>계약 성사</span><b>${refs.filter(r=>r.status==='won').length}건</b></div><div><span>누적 수수료</span><b>${man(m.earned)}</b></div></div></div>
      <div class="body">${D.notice ? `<div class="notice">${esc(D.notice)}</div>` : ''}
        ${UN.notice||UN.dm ? `<button class="hcard" data-go="chat" style="background:#FFF4E8">${UN.notice?`📣 새 공지 ${UN.notice}개`:''}${UN.notice&&UN.dm?' · ':''}${UN.dm?`💬 리츠 답장 ${UN.dm}개`:''}<span>보기 ›</span></button>` : ''}
        ${dealList().length ? (() => { const L = dealList(), r = DEAL.rate || 10, link = D.me.ref_code ? `${location.origin}/r/?c=${D.me.ref_code}` : '', msg = `사장님, 리츠종합클린이 이번에 빈 날 특가로 ${r}% 할인해 준대요!\n${L.join(', ')}\n이 날짜에 청소 필요하시면 아래 링크로 문의 남겨보세요 :)\n${link}`;
          return `<div class="deal"><div class="dh">🔥 빈 날 특가 <b>${r}%</b><span>이 날짜로 소개하면 고객님 할인</span></div><div class="dd">${L.map(x=>`<i>${x}</i>`).join('')}</div><button class="copy" data-copy="${esc(msg)}">고객에게 보낼 문구 복사</button></div>`; })() : ''}
        <button class="cta" data-go="add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>고객 소개하기</button>
        <h2>내 소개 진행 상황</h2>${refs.slice(0,3).map(refCard).join('') || '<div class="it" style="text-align:center;color:var(--sub);font-size:13.5px">아직 소개가 없어요. 주변 사장님 한 분부터 시작해 보세요!</div>'}
        ${refs.length>3?'<button class="btn ghost" style="width:100%" data-go="list">전체 보기</button>':''}
        <button class="hcard" data-go="kit">🎁 홍보 자료함 <span>현장 사진 · 소개 링크 · 카톡 문구 ›</span></button></div>`; },
  chat(){ const dm = room === 'dm';
    const th = MSG == null ? '<div class="it" style="text-align:center;color:var(--sub)">대화를 준비 중이에요</div>' : MSG.map(m => `<div class="mm ${m.from_hq?'hq':'me'}"><div class="b">${esc(m.body)}</div><small>${m.from_hq ? esc(m.author||'리츠') + ' · ' : ''}${hm(m.created_at)}</small></div>`).join('') || `<div class="it" style="text-align:center;color:var(--sub);font-size:13.5px">${dm ? '궁금한 건 편하게 물어보세요 · 리츠가 답해드려요' : '아직 공지가 없어요'}</div>`;
    return `<div class="body" style="padding-top:16px;${dm?'padding-bottom:170px':''}"><div class="rooms"><button data-room="notice" aria-pressed="${!dm}">📣 파트너 공지${UN.notice?`<span class="dot">${UN.notice}</span>`:''}</button><button data-room="dm" aria-pressed="${dm}">💬 리츠와 1:1${UN.dm?`<span class="dot">${UN.dm}</span>`:''}</button></div>
      <div class="th">${th}</div></div>${dm ? `<form class="send" id="sf"><textarea name="t" placeholder="메시지" required></textarea><button type="submit">보내기</button></form>` : ''}`; },
  add(){ return `<div class="body" style="padding-top:18px"><h2 style="margin-top:0;font-size:19px">고객 소개하기</h2><div class="notice" style="margin:0 0 4px">이것만 적어주시면 상담·견적·작업은 리츠가 다 해요</div>
    <form class="f" id="rf"><label class="t" for="c1">업체명 또는 고객 이름</label><input id="c1" name="customer" required placeholder="예) ○○필라테스 원장님">
      <label class="t" for="c2">연락처</label><input id="c2" name="phone" inputmode="tel" placeholder="010-0000-0000">
      <label class="t" for="c3">지역 (동까지)</label><input id="c3" name="area" placeholder="예) 수영구 광안동">
      <label class="t">어떤 청소가 필요해요?</label><div class="kc">${KINDS.map((k,i)=>`<label><input type="radio" name="kind" value="${k}" ${i===0?'checked':''}><span>${k}</span></label>`).join('')}</div>
      <label class="t" for="c4">메모 (희망 날짜·평수 등, 선택)</label><textarea id="c4" name="memo"></textarea>
      <label class="agree"><input type="checkbox" name="consent" required>고객님께 리츠에서 연락드려도 된다고 동의받았어요</label>
      <button class="cta" type="submit">리츠에 넘기기</button>
      <p style="font-size:11.5px;color:var(--sub);text-align:center;margin:6px 0 0">같은 고객을 먼저 소개한 분이 있으면 먼저 접수된 분 기준으로 인정돼요</p></form></div>`; },
  list(){ const refs = D.refs||[]; return `<div class="body" style="padding-top:18px"><h2 style="margin-top:0;font-size:19px">내 소개 ${refs.length}건</h2>${refs.map(refCard).join('') || '<div class="it" style="text-align:center;color:var(--sub)">아직 소개가 없어요</div>'}</div>`; },
  money(){ const m = money(), P = D.pays||[], due = P.filter(x=>!x.paid_on), got = P.filter(x=>x.paid_on);
    const row = x => `<div class="box2"><div class="h" style="display:flex;justify-content:space-between"><b>${esc(x.customer)}</b><span style="font-size:12px;font-weight:700;color:var(--navy)">${x.rounds>1?`정기 ${x.round}/${x.rounds}회차`:'1회'} · ${esc(x.due_month.replace('-','년 ')+'월')}</span></div>
      <div class="mrow"><span>${x.rounds>1?'월 계약금액':'계약금액'}</span><span>${won(x.base)}원</span></div><div class="mrow"><span>수수료 ${D.me.rate}%</span><span>${won(x.fee)}원</span></div><div class="mrow"><span>3.3% 공제</span><span>−${won(x.tax)}원</span></div>
      <div class="mrow t"><span>${x.paid_on?md(x.paid_on)+' 입금 완료':'입금 예정'}</span><b>${won(x.pay)}원</b></div></div>`;
    return `<div class="top" style="padding-bottom:20px"><h1 style="margin-top:0">내 돈</h1><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"><div><span style="font-size:11px;opacity:.8;font-weight:700">번 돈</span><div style="font-size:18px;font-weight:900">${man(m.earned)}</div></div><div><span style="font-size:11px;opacity:.8;font-weight:700">받은 돈</span><div style="font-size:18px;font-weight:900">${man(m.got)}</div></div><div><span style="font-size:11px;color:#FFC07A;font-weight:700">받을 돈</span><div style="font-size:18px;font-weight:900;color:#FFC07A">${man(m.left)}</div></div></div><p style="margin-top:10px;font-size:12px">잔금까지 받은 현장부터 지급 · 3.3% 원천징수 후 입금</p></div>
      <div class="body"><h2 style="margin-top:4px">받을 돈</h2>${due.map(row).join('') || '<div class="it" style="text-align:center;color:var(--sub);font-size:13.5px">아직 없어요 · 계약이 성사되면 여기 생겨요</div>'}
      ${got.length?`<h2>받은 기록</h2>${got.map(row).join('')}`:''}</div>`; },
  album(){ const a = (KIT||[]).find(x => x.id === ALB); if (!a) { tab = 'kit'; return V.kit(); } const link = D.me.ref_code ? `${location.origin}/r/?c=${D.me.ref_code}` : '';
    const msg = (a.caption ? a.caption + '\n' : '') + `청소 견적은 무료예요. 아래 링크로 문의 남기시면 바로 연락 와요 :)\n${link}`;
    return `<div class="body" style="padding-top:14px"><button class="btn ghost sm" data-go="kit" style="margin-bottom:10px">‹ 자료함</button><h2 style="margin:0 0 2px;font-size:19px">${esc(a.title)}</h2><p style="font-size:12.5px;color:var(--sub);margin:0 2px 12px">${esc(a.kind||'')} · ${a.photos.length}장</p>
      <button class="cta" data-save="${a.id}" style="margin-top:0">📥 사진 ${a.photos.length}장 저장 · 보내기</button>
      <div class="box2" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center"><b>같이 보낼 문구</b><button class="copy" data-copy="${esc(msg)}">문구 복사</button></div><div class="msg">${esc(msg)}</div></div>
      ${a.photos.map(p => `<figure class="kf"><img loading="lazy" src="${PURL(p.path, p.bucket)}" alt="${STG[p.stage]||''}"><figcaption class="${p.stage}">${STG[p.stage]||''}</figcaption></figure>`).join('')}
      <p style="font-size:12px;color:var(--sub);text-align:center;margin-top:10px">사진을 길게 누르면 한 장씩 저장할 수도 있어요</p></div>`; },
  kit(){ const link = D.me.ref_code ? `${location.origin}/r/?c=${D.me.ref_code}` : '';
    const msg = `사장님, 청소 업체 찾으시면 제가 아는 곳 소개해 드릴게요! 상가·사무실·준공청소 잘하는 부산 리츠종합클린이에요. 견적은 무료고, 아래 링크로 문의 남기시면 바로 연락 와요 :)\n${link}`;
    return `<div class="body" style="padding-top:18px"><h2 style="margin-top:0;font-size:19px">홍보 자료함</h2><p style="font-size:13px;color:var(--sub);margin:-4px 2px 12px">지인에게 그대로 보내기만 하세요</p>
      <div class="box2" style="background:var(--navy);color:#fff"><b>내 전용 소개 링크</b><p style="font-size:12px;opacity:.85;margin:4px 0 10px">고객이 이 링크로 문의하면 자동으로 ${esc(D.me.name)}님 소개로 기록돼요</p>
        ${link ? `<div class="link"><code style="background:rgba(255,255,255,.14);color:#fff">${esc(link.replace(/^https?:\/\//,''))}</code><button class="copy" style="background:#F68B1F" data-copy="${esc(link)}">복사</button></div>` : '<p style="font-size:13px">링크 준비 중이에요. 리츠에 말씀해 주세요.</p>'}</div>
      <div class="box2"><div style="display:flex;justify-content:space-between;align-items:center"><b>카톡 소개 문구</b><button class="copy" data-copy="${esc(msg)}">문구 복사</button></div><div class="msg">${esc(msg)}</div></div>
      <h2 style="margin:18px 2px 8px;font-size:16px">📷 현장 사진 (작업 전·후)</h2><p style="font-size:12.5px;color:var(--sub);margin:-4px 2px 10px">사진 저장 → 카톡에 링크랑 같이 보내면 반응이 훨씬 좋아요</p>
      ${KIT == null ? '<div class="spin"></div>' : KIT.length ? `<div class="kg">${KIT.map(a => { const cv = a.photos.find(x=>x.stage==='after') || a.photos[0]; return `<button class="ka" data-alb="${a.id}"><img loading="lazy" src="${PURL(cv.path, cv.bucket)}" alt=""><b>${esc(a.title)}</b><span>${esc(a.kind||'')} · ${a.photos.length}장</span></button>`; }).join('')}</div>` : '<div class="it" style="text-align:center;color:var(--sub);font-size:13px">사진 자료를 준비 중이에요</div>'}
      <div class="box2" style="margin-top:14px"><b>이럴 때 소개하세요</b><div class="msg" style="margin-bottom:0">· 가게·사무실 오픈 (인테리어 끝난 직후)\n· 이사 · 입주 앞둔 지인\n· 사무실 정기청소 업체를 바꾸고 싶은 사장님\n· 외국계 회사 사무실</div></div>
      <p style="font-size:12px;color:var(--sub);text-align:center;margin-top:14px">문의 · 010-7193-2246 (문자 or 전화)</p></div>`; }
};
function render(){
  $('#app').innerHTML = V[tab]() + `<nav class="tabs" aria-label="메뉴">${TABS.map(([k,l])=>`<button data-go="${k}" aria-current="${tab===k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}${k==='chat'&&(UN.notice+UN.dm)?`<span class="dot">${UN.notice+UN.dm}</span>`:''}</button>`).join('')}</nav>`;
  window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { tab = g.dataset.go; render(); if (tab === 'chat') loadChat(); if (tab === 'kit' && KIT == null) loadKit(); return; }
  const al = e.target.closest('[data-alb]'); if (al) { ALB = +al.dataset.alb; tab = 'album'; render(); return; }
  const sv = e.target.closest('[data-save]'); if (sv) { savePhotos(+sv.dataset.save, sv); return; }
  const rm = e.target.closest('[data-room]'); if (rm) { room = rm.dataset.room; MSG = []; render(); loadChat(); return; }
  const c = e.target.closest('[data-copy]'); if (c) copy(c.dataset.copy, '복사했어요 · 카톡에 붙여넣으세요');
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'sf') { e.preventDefault(); const t = new FormData(e.target).get('t'); const b = e.target.querySelector('button'); b.disabled = true;
    const r = await sb.rpc('partner_send', {p_token: K, p_body: t}); b.disabled = false;
    if (r.error) return toast(r.error.message.replace(/^.*?:\s*/,'').slice(0,80) || '보내지 못했어요');
    await loadChat(); return; }
  if (e.target.id !== 'rf') return; e.preventDefault();
  const f = new FormData(e.target), b = e.target.querySelector('button[type=submit]'); b.disabled = true;
  const r = await sb.rpc('partner_refer', {p_token: K, p_customer: f.get('customer'), p_phone: f.get('phone')||'', p_area: f.get('area')||'', p_kind: f.get('kind')||'', p_memo: f.get('memo')||'', p_consent: f.get('consent')==='on'});
  b.disabled = false;
  if (r.error) return toast(r.error.message.replace(/^.*?:\s*/,'').slice(0,80) || '접수하지 못했어요');
  toast(r.data === 'dup' ? '접수했어요 · 같은 연락처로 먼저 들어온 소개가 있어 확인할게요' : '접수했어요! 리츠에서 바로 연락드릴게요');
  tab = 'list'; await load();
});
load();
setInterval(() => { if (document.visibilityState !== 'visible') return; if (tab === 'chat') { const a = document.activeElement; if (!(a && a.tagName === 'TEXTAREA' && a.value)) loadChat(); } }, 30000);
})();
</script>
</body>
</html>
