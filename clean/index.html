<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16347A">
<title>어닝플레이스 일정판</title>
<link rel="icon" href="../logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
body{background:var(--bg)}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.head{background:var(--card);padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);font-weight:500}
.brand .logo{width:24px;height:24px;border-radius:6px}
:root[data-biz=res]{--navy:#5B21B6;--info:#6D28D9;--infob:#EDE9FE}
:root[data-biz=ago]{--navy:#1E4A37;--info:#2E8B57;--infob:#E7F5EE}
.hi{min-width:0;word-break:keep-all}
.hirow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:10px}.hirow .epst-ic{margin-top:12px}
.cheer{margin:3px 0 4px;font-size:14px;color:var(--ink,#1f2937);opacity:.8}
.hi b{font-size:20px;font-weight:900;letter-spacing:-.02em;display:block;line-height:1.3}
.hi small{font-size:13px;color:var(--sub)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.summary div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.summary b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.summary span{font-size:11.5px;color:var(--sub)}
.body{flex:1;padding:12px 12px 96px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 10px;flex-wrap:wrap}
.bar h3{margin:0;font-size:16px;font-weight:700}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:13px;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:700}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{border:0;background:var(--card);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;color:var(--sub)}
.mnav b{min-width:84px;text-align:center;font-size:15px}
/* month grid */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--sh);margin-bottom:12px}
.cal .dow,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dow span{font-size:11.5px;color:var(--mute);text-align:center;padding:4px 0}
.cal .dow span:first-child{color:var(--warn)}
.cal .grid button{border:0;background:none;border-radius:10px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-size:14px;color:var(--ink);position:relative}
.cal .grid button.out{color:var(--mute);opacity:.5}
.cal .grid button.today b{background:var(--ink);color:#fff;border-radius:999px;width:24px;height:24px;display:grid;place-items:center}
.cal .grid button[aria-pressed=true]{background:var(--infob)}
.cal .grid b{font-weight:500;font-size:14px;width:24px;height:24px;display:grid;place-items:center}
.dots{display:flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--info)}
.dots i.mine{background:var(--ok)}
.dots i.wait{background:var(--wait)}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:12px;box-shadow:var(--sh)}
.week button{border:0;background:none;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:11.5px}
.week button b{font-size:16px;color:var(--ink);font-weight:700}
.week button[aria-pressed=true]{background:var(--navy);color:#fff}
.week button[aria-pressed=true] b{color:#fff}
.week button.today:not([aria-pressed=true]) b{color:var(--info)}
/* cards */
.dayh{font-size:13.5px;font-weight:700;color:var(--ink2);margin:14px 4px 8px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--line);position:relative}
.card.alert{border-color:var(--warn);box-shadow:0 0 0 2px var(--warnb)}
.card .t1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .when{font-size:12.5px;color:var(--sub);font-weight:500}
.card h4{margin:2px 0 0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.card .note{font-size:13px;color:var(--ink2);margin-top:6px}
.card .row2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--sub)}
.card .row2 b{color:var(--ink)}
.crew{display:flex;gap:4px;flex-wrap:wrap}
.crew span{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink2)}
.addr{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;background:var(--okb);color:#065F46;border-radius:10px;padding:9px 11px;margin-top:10px}
.addr.lock{background:var(--soft);color:var(--sub)}
.addr svg.i{width:16px;height:16px;margin-top:3px}
.addr a{color:inherit}
.money{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--waitb);color:#7C2D12;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:13.5px}
.money b{font-size:16px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1}
.ack{background:var(--warnb);color:var(--warn);border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13.5px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* report */
.form{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.upl{display:flex;gap:6px;flex-wrap:wrap}
.upl .ph{width:72px;height:72px;border-radius:12px;background:var(--soft) center/cover;position:relative;border:1px solid var(--line)}
.upl .ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:12px;line-height:22px;padding:0}
.upl label.add{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--mute);cursor:pointer;background:var(--card)}
.upl input{display:none}
/* notices */
.notice{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);margin-bottom:10px}
.notice.new{border-color:var(--info)}
.notice small{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:12px;margin-bottom:4px}
.notice h4{margin:0 0 4px;font-size:15px}
.notice p{margin:0;white-space:pre-wrap;font-size:14.5px;color:var(--ink2)}
.pay{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:12px 14px;margin-bottom:12px}
.pay .tot{display:flex;justify-content:space-between;align-items:baseline}
.pay .tot b{font-size:22px;font-weight:900}
.pay ul{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.pay li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);gap:8px}
/* 내 정산 · 캘린더 */
.paydet{margin-top:8px}.paydet summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);padding:6px 2px;list-style:none}.paydet summary::after{content:' ▾'}.paydet[open] summary::after{content:' ▴'}
.icsrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.icsrow b{display:block;font-size:14px}.icsrow small{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:520px;align-items:center}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);padding:6px 0;border-radius:10px;position:relative}
.tabbar button[aria-pressed=true]{color:var(--navy);font-weight:700}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--warn);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;font-weight:700;min-width:16px;text-align:center}
.err{max-width:420px;margin:80px auto;padding:24px;text-align:center}
.err h2{margin:12px 0 6px}
.err p{color:var(--sub)}
.foot{font-size:11.5px;color:var(--mute);text-align:center;margin:18px 0 0}

.boss{margin-top:10px;border-radius:12px;padding:8px 12px;font-size:13px;background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA;display:flex;gap:6px;align-items:center}
.boss.busy{background:#FEF2F2;color:#991B1B;border-color:#FECACA}
.boss.ok{background:#F0FDF4;color:#166534;border-color:#BBF7D0}
.tabbar .plus{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;margin:-14px auto 0;box-shadow:0 6px 16px rgba(22,52,122,.35);padding:0}
.tabbar .plus svg{width:24px;height:24px}
.cal .grid button .av{font-size:9.5px;border-radius:4px;padding:0 4px;line-height:1.4}
.av.ok{background:#DCFCE7;color:#15803D}.av.no{background:#FEE2E2;color:#B91C1C}
.dots i.ev{background:#E879A8}
.week button .av{font-size:9px}
.card.evc{border-left:4px solid #E879A8}
.sheetbg{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheetbox h3{margin:0 0 12px;font-size:17px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:13px 14px;font-size:15px;font-weight:700;text-align:left}
.menu button small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.segs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.paint .grid button{border:1px solid var(--line);border-radius:10px;aspect-ratio:1/1;font-size:14px;background:var(--card)}
.paint .grid button.ok{background:#DCFCE7;border-color:#86EFAC;color:#166534;font-weight:700}
.paint .grid button.no{background:#FEE2E2;border-color:#FCA5A5;color:#991B1B;font-weight:700}
.paint .grid button.out{visibility:hidden}
.paint .grid button.past{opacity:.35}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;gap:10px}
.tog input{width:20px;height:20px}
.phg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.phg img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;background:var(--soft)}
.phg figure{margin:0;position:relative}.phg figcaption{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.5);color:#fff;border-radius:4px;padding:0 4px}
.okline{font-size:13px;background:var(--okb);color:#065F46;border-radius:10px;padding:8px 11px}
.ics{font-size:12px;word-break:break-all;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace}
</style>
</head>

<script src="../status.js?v=1029i"></script>
<script src="../profile.js"></script>
<script src="../greet.js"></script>
<script>window.EP_VER='1029i'</script>
<script src="../chatkit.js?v=1029i"></script>
<script src="../chat.js?v=1029i"></script>

<script>
(function(){
const C = window.EP_CONFIG;
const GAS = C.MAEMUL_API || 'https://script.google.com/macros/s/AKfycbxZFsXwTIiiq7xd2iFbbAb5vgtS4lRbNuBp0XCrleCQZYAzr_1ja6VnZKhnvh6fkp-h/exec';
const qs = new URLSearchParams(location.search);
const DEMO = qs.has('demo');
const TOKEN = (qs.get('k') || '').trim();
if (TOKEN === 'hq') { location.replace('../hq/#sched'); }   // 대표님 알림톡 [일정판 보기] → HQ 일정
try { if (TOKEN && TOKEN !== 'hq' && !qs.has('demo')) localStorage.setItem('ep_k', TOKEN); } catch(_){}   // 카톡 채널 [대화하기] 버튼(/go)이 기억해서 바로 열기
const sb = DEMO ? null : window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY, {auth:{persistSession:false}});

/* ---------- api ---------- */
async function rpc(fn, args){
  if (DEMO) return window.EP_DEMO.rpc(fn, args);
  const {data, error} = await sb.rpc(fn, args);
  if (error) throw error;
  return data;
}

/* ---------- helpers ---------- */
const I = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const won = n => (n ?? 0).toLocaleString('ko-KR') + '원';
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()} ${DOW[d.getDay()]}`; };
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('on'), 2400); }
const ERR = {invalid_link:'링크가 맞지 않아요. 대표님께 새 링크를 받아주세요.', closed:'이미 마감된 일정이에요.', past:'지난 일정은 바꿀 수 없어요.', not_allowed:'이 일정은 할 수 없어요.', empty:'내용을 한 줄 적어주세요.', bad_photo:'사진을 다시 골라주세요.', collector_only:'[작업 끝]은 오늘 수금 담당이 눌러요.'};
const errMsg = e => ERR[(e && e.message) || ''] || '잠시 후 다시 시도해주세요.';
const photoUrl = p => `${C.SUPABASE_URL}/storage/v1/object/public/live/${p}`;

/* ---------- state ---------- */
let D = null;                       // board data
let tab = qs.get('tab') === 'mine' ? 'mine' : 'board';
let view = 'week';                  // week | month
let scope = 'team';                 // team | mine
let today = new Date(); today.setHours(0,0,0,0);
let pick = ymd(today);
let month = new Date(today.getFullYear(), today.getMonth(), 1);
let photos = [];                    // 보고 사진 {file, url}
let payData = null;
let paint = null;                   // 가능·불가일 칠하기 {mode, marks:{}}
let evEdit = null;                  // 개인 일정 편집
let shoot = null;                   // 현장 사진 {job, stage, files:[], memo}
const V2 = () => D && D.v === 2;
const isRES = () => D && D.me.team === 'RES';
const isAGO = () => D && D.me.team === 'AGO';
const EVT = () => isRES() || isAGO(); // 개인 일정 중심 (부동산·아고 파트너)
const W = (cl, ago) => isAGO() ? ago : cl; // 아고 파트너용 말투
const who = () => isAGO() ? `${D.me.name} ${(D.me.role||'사장').replace(/님$/,'')}님` : `${D.me.name}님`;

async function load(){
  const from = ymd(addDays(month, -7));
  const to = ymd(addDays(new Date(month.getFullYear(), month.getMonth()+1, 0), 14));
  const wkFrom = ymd(addDays(parse(pick), -7)), wkTo = ymd(addDays(parse(pick), 14));
  D = await rpc('staff_board', {p_token: TOKEN, p_from: from < wkFrom ? from : wkFrom, p_to: to > wkTo ? to : wkTo});
  if (D.today) { today = parse(D.today); }
  D.avail = D.avail || {}; D.events = D.events || [];
}

/* ---------- views ---------- */
function jobsOn(day){ return D.jobs.filter(j => j.date === day && (scope === 'team' || ['applied','approved'].includes(j.my_status))); }
const evsOn = day => D.events.filter(e => e.date === day);
const mineOK = () => D.jobs.filter(j => j.my_status === 'approved');

function statusPill(j){
  if (j.status === 'cancelled') return '<span class="pill p-mute">취소됨</span>';
  if (j.status === 'done') return '<span class="pill p-mute">마감</span>';
  if (j.my_status === 'approved') return '<span class="pill p-ok">'+I('check').replace('class="i"','class="i" style="width:14px;height:14px"')+'확정</span>';
  if (j.my_status === 'applied') return '<span class="pill p-wait">승인 대기</span>';
  if (j.status === 'full' || j.approved >= j.headcount) return '<span class="pill p-mute">인원 마감</span>';
  return `<span class="pill p-warn">${Math.max(0, j.headcount - j.approved)}자리</span>`;
}

function card(j){
  const past = j.date < ymd(today);
  const canApply = !j.my_status || ['cancelled','rejected'].includes(j.my_status);
  let btn = '';
  if (j.status === 'cancelled' || j.status === 'done' || past) btn = '';
  else if (j.my_status === 'approved') btn = `<div class="acts"><button class="btn ghost sm" data-cancel="${j.id}">못 가게 됐어요 (취소)</button></div>`;
  else if (j.my_status === 'applied') btn = `<div class="acts"><button class="btn wait" data-cancel="${j.id}">승인 기다리는 중 · 취소</button></div>`;
  else if (canApply && j.status === 'open' && j.approved < j.headcount) btn = `<div class="acts"><button class="btn" data-apply="${j.id}">신청하기</button></div>`;

  const shootBtn = shootable ? `<div class="acts"><button class="btn" data-shoot="${j.id}">${I('cam')}${W('현장 사진','촬영 사진')}${j.photos?` (${j.photos}장)`:''}</button>${j.cust_room?`<button class="btn ghost" data-croom="${j.cust_room}">💬 손님방</button>`:''}${j.work_done?'<span class="pill p-ok" style="align-self:center">작업 끝</span>':''}</div>` : '';

  const ack = j.need_ack ? `<div class="ack"><span>일정이 바뀌었어요. 확인해주세요</span><button class="btn sm" style="background:var(--warn)" data-ack="${j.id}">확인했어요</button></div>` : '';
  const addr = j.my_status === 'approved'
    ? `<div class="addr">${I('pin')}<span>${j.address ? `<a href="https://map.kakao.com/link/search/${encodeURIComponent(j.address)}" target="_blank" rel="noopener">${esc(j.address)}</a>` : '주소는 따로 알려드릴게요'}${j.private_note ? `<br><small>${esc(j.private_note)}</small>` : ''}</span></div>`
    : (j.my_status === 'applied' ? `<div class="addr lock">${I('lock')}확정되면 상세 주소가 열려요</div>` : '');
  const cust = j.collector && (j.cust_name || j.cust_phone)
    ? `<div class="money"><span>고객 <b>${esc(j.cust_name||'')}</b></span>${j.cust_phone ? `<a class="btn sm" href="tel:${esc(j.cust_phone.replace(/[^0-9+]/g,''))}">📞 ${esc(j.cust_phone)}</a>` : ''}</div>` : '';
  const money = j.collector && j.balance != null
    ? (j.collected_at ? `<div class="money"><span>잔금 ${won(j.balance)}</span><span class="pill p-ok">수금 완료</span></div>`
       : `<div class="money"><span>현장 잔금 <b>${won(j.balance)}</b></span><span><button class="btn sm" data-collect="${j.id}" data-how="계좌">계좌 확인</button> <button class="btn sm ghost" data-collect="${j.id}" data-how="현금">현금</button></span></div>`) : '';
  const pay = j.my_pay != null ? `<div class="row2"><span>내 정산</span><b>${won(j.my_pay)}</b></div>` : '';
  return `<article class="card ${j.need_ack?'alert':''}">
    <div class="t1"><div><div class="when">${md(j.date)}${j.time ? ' · '+j.time : ''}${j.kind ? ' · '+esc(j.kind) : ''}</div><h4>${esc(j.title)}</h4></div>${statusPill(j)}</div>
    ${j.public_note ? `<div class="note">${esc(j.public_note)}</div>` : ''}
    <div class="row2"><span><b>${j.approved}</b> / ${j.headcount}명 확정</span><span class="crew">${j.crew.map(n=>`<span>${esc(n)}</span>`).join('')}</span></div>
    ${ack}${addr}${cust}${money}${pay}${shootBtn}${btn}</article>`;
}
function evCard(e){
  return `<article class="card evc"><div class="t1"><div><div class="when">${md(e.date)}${e.time?' · '+e.time:''} · 내 일정</div><h4>${esc(e.kind)} ${e.maemul?`<span class="pill p-mute">${esc(e.maemul)}</span>`:''} ${esc(e.title)}</h4></div><button class="btn ghost sm" data-evedit="${e.id}">${I('edit')}수정</button></div>
    ${e.memo?`<div class="note">${esc(e.memo)}</div>`:''}<div class="row2"><span>${e.show_boss?'대표님 일정판에 보임':'나만 보기'}${e.gcal?' · 구글 캘린더':''}</span></div></article>`;
}
const avTag = s => { const k = D.avail[s]; return k === 'ok' ? '<span class="av ok">가능</span>' : k === 'no' ? '<span class="av no">불가</span>' : ''; };
const dots = s => { const js = jobsOn(s), es = evsOn(s); return `<span class="dots">${js.slice(0,3).map(j=>`<i class="${j.my_status==='approved'?'mine':j.my_status==='applied'?'wait':''}"></i>`).join('')}${es.slice(0,2).map(()=>'<i class="ev"></i>').join('')}</span>`; };

function weekStrip(){
  const p = parse(pick); const start = addDays(p, -p.getDay());
  let h = '<div class="week" role="group" aria-label="이번 주">';
  for (let i=0;i<7;i++){ const d = addDays(start,i), s = ymd(d);
    h += `<button data-day="${s}" class="${s===ymd(today)?'today':''}" aria-pressed="${s===pick}">${DOW[i]}<b>${d.getDate()}</b>${dots(s)}${avTag(s)}</button>`; }
  return h + '</div>';
}
function monthGrid(){
  const first = new Date(month), start = addDays(first, -first.getDay());
  let h = `<div class="cal"><div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div><div class="grid">`;
  for (let i=0;i<42;i++){ const d = addDays(start,i), s = ymd(d);
    if (i===35 && d.getMonth()!==month.getMonth()) break;
    h += `<button data-day="${s}" class="${d.getMonth()!==month.getMonth()?'out':''} ${s===ymd(today)?'today':''}" aria-pressed="${s===pick}"><b>${d.getDate()}</b>${dots(s)}${avTag(s)}</button>`; }
  return h + '</div></div>';
}

    (evs.map(evCard).join('') + list.map(card).join('') || `<p class="empty">${scope==='mine'?'이 날 내 일정이 없어요':'이 날은 일정이 없어요'}${V2()?'<br><button class="btn ghost sm" style="margin-top:10px" data-plus="1">＋ 일정 · 가능일 넣기</button>':''}</p>`);
}

    `<div class="bar" style="margin-top:18px"><h3>${isAGO()?'파트너 정산':'내 정산'}</h3></div>` + EPMoney.html() + (payBox ? `<details class="paydet"><summary>${month.getMonth()+1}월 현장별 보기</summary>${payBox}</details>` : '') + ics;

function bossBanner(){

  const until = b.until ? new Date(b.until) : null;

  return `<div class="boss ${st==='Busy'?'busy':st==='근무중'?'ok':''}">대표님: ${icon} ${esc(st)} ${u}${b.memo?' · '+esc(b.memo):''}</div>`;

    <div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>날짜</label><input type="date" name="date" value="${e.date}" required></div><div class="field" style="flex:1"><label>시간</label><input type="time" name="time" value="${e.time||''}"></div></div>
    <div class="field"><label>캘린더에 보일 말</label><input name="title" value="${esc(e.title||'')}" placeholder="${isRES()?'광안동 원룸 계약':isAGO()?'스튜디오 라이브 촬영':'병원'}" required maxlength="80"><div class="hint">손님 이름·연락처는 넣지 말아 주세요 (매물번호·동네까지만)</div></div>
    <div class="field"><label>메모 (나만 보기)</label><input name="memo" value="${esc(e.memo||'')}" maxlength="500"></div>
    <label class="tog">대표님 일정판에 보이기<input type="checkbox" name="show_boss" ${e.show_boss!==false?'checked':''}></label>
    <label class="tog">내 구글 캘린더에 넣기<input type="checkbox" name="gcal" ${e.gcal?'checked':''}></label>
    <button class="btn" type="submit">저장하기</button>
    ${e.id?`<button class="btn ghost" type="button" data-evdel="${e.id}">이 일정 지우기</button>`:''}
   </form>`;
}

function shootView(){
  const j = D.jobs.find(x => x.id === shoot.job); const lab = {before:'작업 전', during:'작업 중', after:'작업 후'};
  return `<div class="bar"><h3>${I('cam')} ${W('현장 사진','촬영 사진')}</h3><button class="btn ghost sm" data-tab="board">닫기</button></div>
    <div class="form">
      <div><div style="font-size:12.5px;color:var(--sub)">${md(j.date)}${j.time?' · '+j.time:''}</div><b style="font-size:16px">${esc(j.title)}</b></div>
      <div class="segs">${Object.entries(lab).map(([k,l])=>`<button type="button" data-stage="${k}" aria-pressed="${shoot.stage===k}">${l}</button>`).join('')}</div>
      <label class="btn" style="width:100%;cursor:pointer">${I('cam')}사진 찍어 올리기<input type="file" id="shootin" accept="image/*" multiple style="display:none"></label>
      <div style="font-size:12px;color:var(--sub);text-align:center;margin-top:-6px">여러 장 한 번에 · 자동으로 용량 줄여서 올라가요</div>
      <div class="field"><label>한 줄 메모 (선택 · 손님 화면에 보여요)</label><input id="shootmemo" value="${esc(shoot.memo||'')}" placeholder="예) 줄눈 곰팡이 집중 작업 중이에요" maxlength="200"></div>
      ${shoot.busy?`<div class="okline">올리는 중… ${shoot.busy}</div>`:''}
      ${shoot.done.length?`<div class="okline">✓ ${shoot.done.length}장 올렸어요 · 손님 페이지에 바로 보여요</div><div class="phg">${shoot.done.slice(-9).map(x=>`<figure><img src="${x.url}" alt=""><figcaption>${lab[x.stage]}</figcaption></figure>`).join('')}</div>`:''}
      ${j.cust_room?`<button class="btn ghost" style="width:100%" data-croom="${j.cust_room}">💬 손님방 열기 · 손님에게 글·사진 보내기</button>`:''}
      ${j.work_done?'<div class="okline">작업 끝으로 표시됐어요 · 손님 화면이 완료 리포트로 바뀌었어요</div>':j.can_done===false?'<div class="okline" style="background:#F3F4F6;color:var(--sub)">[작업 끝]은 오늘 수금 담당이 눌러요</div>':`<button class="btn" style="background:var(--ok)" data-workdone="${j.id}">작업 끝 (후 사진 다 올렸어요)</button>`}
    </div>`;
}

function render(){
  const app = document.getElementById('app');
  const ok = mineOK().filter(j=>j.date>=ymd(today)&&j.status!=='cancelled').length;
  const open = D.jobs.filter(j=>!j.my_status && j.status==='open' && j.approved<j.headcount && j.date>=ymd(today)).length;
  const unread = D.notices.filter(n=>!n.read || (n.important && !n.confirmed)).length;
  const acks = D.jobs.filter(j=>j.need_ack).length;
  const mm = isRES() && /^[a-f0-9]{20}$/.test(TOKEN) ? `<a class="btn ghost sm" href="../maemul/?k=${encodeURIComponent(TOKEN)}" style="margin-left:auto">매물노트로</a>` : '';
  const evN = D.events.filter(e=>e.date>=ymd(today)).length;
  const gr = EPGreet.get(isRES() ? 'maemul' : isAGO() ? 'ago' : 'clean');
  document.documentElement.dataset.biz = isRES() ? 'res' : isAGO() ? 'ago' : 'clean';
  const main = tab==='board'?boardView():tab==='mine'?mineView():tab==='report'?reportView():tab==='paint'?paintView():tab==='ev'?evForm():tab==='shoot'?shootView():noticeView();
  app.innerHTML = `<header class="head"><div class="brand"><img class="logo" src="../logo.svg" alt="">${isAGO() ? '아고스튜디오 파트너룸' : esc(C.BRAND)+' 일정판'}${mm}</div>
     <div class="hirow"><div style="display:flex;gap:12px;align-items:center;min-width:0">${EPProfile.av(D.me.name,46,{me:true})}<div class="hi"><b>${esc(who())}, ${esc(gr.h)}</b><p class="cheer">${esc(gr.s)}</p><small>${isAGO() ? `${esc(D.me.team_name)} 레이블 파트너 · co-work` : `${esc(D.me.team)} · ${esc(D.me.team_name)}${D.me.role?' · '+esc(D.me.role):''}`}</small></div></div>${EPStatus.pill()}</div>
     <div class="summary">${EVT()?`<div><b>${evN}</b><span>다가오는 내 일정</span></div>`:`<div><b>${ok}</b><span>확정된 일정</span></div>`}<div><b style="color:var(--warn)">${EVT()?ok:open}</b><span>${isAGO()?'확정 일정':isRES()?'확정 현장':'신청 가능'}</span></div><div><b>${unread}</b><span>안 읽은 공지</span></div></div></header>
   <main class="body">${main}
   <p class="foot">${esc(C.BRAND)} · 이 링크는 ${esc(who())} 전용이에요. 다른 사람과 공유하지 마세요.</p></main>`;
  tabbar();
}
function tabbar(){
  if (!D) return;
  const acks = D.jobs.filter(j=>j.need_ack).length, unread = D.notices.filter(n=>!n.read || (n.important && !n.confirmed)).length, ch = EPChat.state;
  const tb = document.getElementById('tabbar'); tb.classList.remove('hidden');
  const items = [['board','cal','일정판',acks], ch.on ? ['chat','chat','대화',ch.unread] : null, ['mine','check','내 일정',0], V2() ? ['plus'] : null, ['report','cam',W('사진·보고','촬영·공유'),0],['notice','bell','공지',unread]].filter(Boolean);
  tb.querySelector('nav').style.gridTemplateColumns = `repeat(${items.length},1fr)`;
  tb.querySelector('nav').innerHTML = items.map(([k,i,l,b]) => k==='plus' ? `<button class="plus" data-plus="1" aria-label="넣기">${I('plus')}</button>`
    : k==='chat' ? `<button data-chat="1">${I(i)}${l}${b?`<span class="badge">${b>99?'99+':b}</span>`:''}</button>`
    : `<button data-tab="${k}" aria-pressed="${tab===k}">${I(i)}${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
}

/* ---------- events ---------- */
async function act(fn, args, msg){
  try { await rpc(fn, args); if (msg) toast(msg); await load(); render(); }
  catch(e){ toast(errMsg(e)); }
}
async function openPaint(){
  const m = new Date(month); paint = {mode:'ok', month:m, marks:Object.assign({}, D.avail), orig:Object.assign({}, D.avail)};
  closeSheet(); tab = 'paint'; render(); window.scrollTo(0,0);
}
async function paintMonth(n){
  paint.month = new Date(paint.month.getFullYear(), paint.month.getMonth()+n, 1);
  const f = ymd(addDays(paint.month,-7)), t = ymd(addDays(new Date(paint.month.getFullYear(), paint.month.getMonth()+1, 0), 7));
  try { const b = await rpc('staff_board', {p_token:TOKEN, p_from:f, p_to:t}); Object.entries(b.avail||{}).forEach(([k,v]) => { if (!(k in paint.marks)) { paint.marks[k] = v; paint.orig[k] = v; } }); } catch(_){}
  render();
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || !D) return; const d = b.dataset;
  if (d.tab){ closeSheet(); tab = d.tab; window.scrollTo(0,0);
    if (tab==='notice'){ const ids = D.notices.filter(n=>!n.read).map(n=>n.id); render(); if (ids.length){ try{ await rpc('staff_notice_read',{p_token:TOKEN,p_ids:ids}); D.notices.forEach(n=>n.read=true);}catch(_){} } return; }
    if (tab==='mine'){ render(); try{ payData = await rpc('staff_pay',{p_token:TOKEN,p_month:ymd(month)}); }catch(_){ payData=[]; } }
    if (tab==='board' && (paint || shoot)){ paint = null; shoot = null; try{ await load(); }catch(_){} }
    render(); return; }
  if (d.plus){ plusMenu(); return; }
  if (d.chat){ EPChat.open(); return; }
  if (d.croom){ EPChat.open(+d.croom); return; }
  if (d.view){ view = d.view; render(); return; }
  if (d.scope){ scope = d.scope; render(); return; }
  if (d.day){ const old = month; pick = d.day; const p = parse(pick); month = new Date(p.getFullYear(), p.getMonth(), 1);
    if (old.getMonth()!==month.getMonth()) { await load(); } render(); return; }
  if (d.mnav){ month = new Date(month.getFullYear(), month.getMonth()+Number(d.mnav), 1); pick = ymd(month); await load(); render(); return; }
  if (d.wnav){ pick = ymd(addDays(parse(pick), Number(d.wnav))); const p = parse(pick); const nm = new Date(p.getFullYear(),p.getMonth(),1);
    if (nm.getTime()!==month.getTime()){ month = nm; } await load(); render(); return; }
  if (d.apply){ b.disabled = true; return act('staff_apply',{p_token:TOKEN,p_job:+d.apply},'신청했어요 · 대표님 승인을 기다려요'); }
  if (d.cancel){ if (!confirm('이 일정을 취소할까요?')) return; return act('staff_cancel',{p_token:TOKEN,p_job:+d.cancel},'취소했어요'); }
  if (d.ack){ return act('staff_ack',{p_token:TOKEN,p_job:+d.ack},'확인 완료!'); }
  if (d.collect){ if (!confirm(`${d.how}으로 잔금을 받으셨나요?`)) return; return act('staff_collect',{p_token:TOKEN,p_job:+d.collect,p_how:d.how},'수금 완료로 표시했어요'); }
  if (d.nconf){ return act('staff_notice_confirm',{p_token:TOKEN,p_id:+d.nconf},'확인했어요'); }
  if (d.rmph){ URL.revokeObjectURL(photos[+d.rmph].url); photos.splice(+d.rmph,1); keepText(()=>render()); return; }
  // 하루 가능·불가 (일정판에서 바로)
  if (d.av1){ return act('staff_set_avail',{p_token:TOKEN,p_days:[pick],p_kind:d.av1,p_memo:null}, d.av1==='ok'?'이날 가능으로 표시했어요':d.av1==='no'?'이날 불가로 표시했어요':'지웠어요'); }
  // 칠하기
  if (d.paint){ return openPaint(); }
  if (d.pmode){ paint.mode = d.pmode; render(); return; }
  if (d.pmon){ return paintMonth(+d.pmon); }
  if (d.pd){ if (paint.mode === 'clear') delete paint.marks[d.pd]; else paint.marks[d.pd] = paint.marks[d.pd] === paint.mode ? undefined : paint.mode; if (!paint.marks[d.pd]) delete paint.marks[d.pd]; render(); return; }
  if (d.pquick){ const m = paint.month, t = ymd(today);
    for (let x = new Date(m); x.getMonth() === m.getMonth(); x = addDays(x,1)) { const s = ymd(x); if (s < t) continue; const w = x.getDay();
      if (d.pquick === 'wd' && w > 0 && w < 6) paint.marks[s] = 'ok';
      if (d.pquick === 'we' && (w === 0 || w === 6)) paint.marks[s] = 'no'; }
    if (d.pquick === 'copy') { const pm = new Date(m.getFullYear(), m.getMonth()-1, 1); Object.entries(paint.marks).forEach(([k,v]) => { const kd = parse(k); if (kd.getMonth() === pm.getMonth() && kd.getFullYear() === pm.getFullYear()) { const nd = new Date(m.getFullYear(), m.getMonth(), kd.getDate()); if (nd.getMonth() === m.getMonth() && ymd(nd) >= t) paint.marks[ymd(nd)] = v; } }); }
    render(); return; }
  if (d.psave){ b.disabled = true; const t = ymd(today);
    const all = new Set([...Object.keys(paint.marks), ...Object.keys(paint.orig)].filter(s => s >= t));
    const ok = [], no = [], clr = [];
    all.forEach(s => { const n = paint.marks[s], o = paint.orig[s]; if (n === o) return; if (n === 'ok') ok.push(s); else if (n === 'no') no.push(s); else clr.push(s); });
    try { if (ok.length) await rpc('staff_set_avail',{p_token:TOKEN,p_days:ok,p_kind:'ok',p_memo:null}); if (no.length) await rpc('staff_set_avail',{p_token:TOKEN,p_days:no,p_kind:'no',p_memo:null}); if (clr.length) await rpc('staff_set_avail',{p_token:TOKEN,p_days:clr,p_kind:'clear',p_memo:null});
      toast('저장했어요 · 대표님이 인력 배정할 때 봐요'); paint = null; tab = 'board'; await load(); render(); } catch(err){ toast(errMsg(err)); b.disabled = false; }
    return; }
  // 개인 일정
  if (d.evnew){ closeSheet(); evEdit = {date: pick < ymd(today) ? ymd(today) : pick, kind: isRES() ? '계약' : isAGO() ? '미팅' : '개인', show_boss: EVT(), gcal: false}; tab = 'ev'; render(); window.scrollTo(0,0); return; }
  if (d.evedit){ evEdit = Object.assign({}, D.events.find(x => x.id == d.evedit)); tab = 'ev'; render(); window.scrollTo(0,0); return; }
  if (d.evk){ const f = document.getElementById('evForm'); const keep = Object.fromEntries(new FormData(f)); evEdit = Object.assign(evEdit, {kind:d.evk, date:keep.date, time:keep.time, title:keep.title, memo:keep.memo, maemul:keep.maemul, show_boss:!!keep.show_boss, gcal:!!keep.gcal}); render(); return; }
  if (d.evdel){ if (!confirm('이 일정을 지울까요?')) return; try { await rpc('staff_event_delete',{p_token:TOKEN,p_id:+d.evdel}); toast('지웠어요'); evEdit = null; tab = 'board'; await load(); render(); } catch(err){ toast(errMsg(err)); } return; }
  if (d.icscopy){ try { await navigator.clipboard.writeText(`${GAS}?ics=${TOKEN}`); toast('주소를 복사했어요'); } catch(_) { prompt('복사해서 쓰세요', `${GAS}?ics=${TOKEN}`); } return; }
  // 현장 사진
  if (d.shoot){ closeSheet(); shoot = {job:+d.shoot, stage: (D.jobs.find(x=>x.id==d.shoot)||{}).photos ? 'during' : 'before', done:[], memo:''}; tab = 'shoot'; render(); window.scrollTo(0,0); return; }
  if (d.stage){ shoot.memo = (document.getElementById('shootmemo')||{}).value || ''; shoot.stage = d.stage; render(); return; }
  if (d.workdone){ if (!confirm('작업이 끝났나요? 손님 화면이 완료 리포트(계좌 안내)로 바뀌어요.')) return;
    try { await rpc('staff_work_done',{p_token:TOKEN,p_job:+d.workdone}); const j = D.jobs.find(x=>x.id==d.workdone); if (j) j.work_done = new Date().toISOString(); toast('작업 끝! 고생 많으셨어요 🙏'); render(); } catch(err){ toast(errMsg(err)); } return; }
});
function keepText(fn){ const t = document.getElementById('r-text'), j = document.getElementById('r-job'); const v = t && t.value, jv = j && j.value; fn(); const t2 = document.getElementById('r-text'), j2 = document.getElementById('r-job'); if (t2 && v) t2.value = v; if (j2 && jv != null) j2.value = jv; }
document.addEventListener('change', async e => {
  if (e.target.id === 'phin'){ const files = [...e.target.files].slice(0, 6 - photos.length);
    files.forEach(f => photos.push({file:f, url:URL.createObjectURL(f)})); keepText(()=>render()); }
  if (e.target.id === 'shootin'){ const files = [...e.target.files]; if (!files.length) return;
    shoot.memo = (document.getElementById('shootmemo')||{}).value || '';
    try {
      const code = DEMO ? 'DEMO' : await rpc('staff_live_target', {p_token:TOKEN, p_job:shoot.job});
      const paths = [];
      for (let i = 0; i < files.length; i++) { shoot.busy = `${i+1}/${files.length}`; render();
        const blob = await shrink(files[i]); const path = `${code}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        if (!DEMO) { const {error} = await sb.storage.from('live').upload(path, blob, {contentType:'image/jpeg'}); if (error) throw error; }
        paths.push(path); shoot.done.push({url: DEMO ? URL.createObjectURL(files[i]) : photoUrl(path), stage: shoot.stage}); }
      await rpc('staff_job_photo', {p_token:TOKEN, p_job:shoot.job, p_paths:paths, p_stage:shoot.stage, p_memo:shoot.memo || null});
      const j = D.jobs.find(x=>x.id===shoot.job); if (j) j.photos = (j.photos||0) + paths.length;
      shoot.busy = null; shoot.memo = ''; toast(`${paths.length}장 올렸어요`); render();
    } catch(err){ shoot.busy = null; toast(errMsg(err)); render(); }
  }
});
async function shrink(file){
  try{
    const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  }catch(_){ return file; }
}
document.addEventListener('submit', async e => {
  if (e.target.id === 'evForm'){ e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    try { await rpc('staff_event_save', {p_token:TOKEN, p_id: evEdit.id || null, p_date:v.date, p_time:v.time || null, p_kind:evEdit.kind, p_maemul:v.maemul || null, p_title:v.title, p_memo:v.memo || null, p_show_boss:!!v.show_boss, p_gcal:!!v.gcal});
      toast(v.show_boss ? '저장했어요 · 대표님 일정판에도 보여요' : '저장했어요'); pick = v.date; evEdit = null; tab = 'board'; await load(); render(); } catch(err){ toast(errMsg(err)); }
    return; }
  if (e.target.id !== 'repForm') return; e.preventDefault();
  const btn = document.getElementById('repBtn'); btn.disabled = true; btn.textContent = '보내는 중…';
  const job = document.getElementById('r-job').value || null;
  const body = document.getElementById('r-text').value;
  try{
    const paths = [];
    for (let i=0;i<photos.length;i++){
      const blob = await shrink(photos[i].file);
      const path = `${TOKEN}/${job||'none'}/${Date.now()}-${i}.jpg`;
      if (!DEMO){ const {error} = await sb.storage.from('reports').upload(path, blob, {contentType:'image/jpeg'}); if (error) throw error; }
      paths.push(path);
    }
    await rpc('staff_report', {p_token:TOKEN, p_job: job ? +job : null, p_body: body, p_photos: paths});
    photos.forEach(p=>URL.revokeObjectURL(p.url)); photos = [];
    toast('보고 접수! 고생 많으셨어요 🙏'); tab = 'board'; render();
  }catch(err){ toast(errMsg(err)); btn.disabled = false; btn.textContent = '보고 보내기'; }
});

/* ---------- start ---------- */
(async () => {
  if (!TOKEN && !DEMO){ document.getElementById('app').innerHTML = `<div class="err"><img class="logo" src="../logo.svg" alt="" style="width:48px;height:48px"><h2>${esc(C.BRAND)} 일정판</h2><p>개인 링크로 들어와 주세요.<br>링크는 '${esc(C.BRAND)}' 카카오톡 채널로 받을 수 있어요.</p></div>`; return; }
  EPProfile.init({token:TOKEN, demo:DEMO, nameFn:()=>D&&D.me&&D.me.name, onChange:()=>{ if (D && !['paint','ev','shoot'].includes(tab)) render(); }});
  EPMoney.init({token:TOKEN, demo:DEMO, onChange:()=>{ if (D && tab==='mine') render(); }});
  { let last = '';
    EPChat.init({token:TOKEN, demo:DEMO && qs.has('chat'), accent:(getComputedStyle(document.documentElement).getPropertyValue('--navy')||'#16347A').trim(),
      onState:st => { const k = st.on + '/' + st.unread; if (k !== last) { last = k; tabbar(); } }}); }
  EPStatus.init({manual:()=>D&&D.boss, onChange:()=>{ if (D && !['paint','ev','shoot'].includes(tab)) render(); }, demo:DEMO});
  try { await load(); if (EVT()) scope = 'mine';
    if (qs.has('new') && EVT()) { evEdit = {date: ymd(today), kind: isRES() ? '계약' : '미팅', show_boss: true, gcal: false}; tab = 'ev'; }   // 매물노트 [＋ 계약·잔금·안내 넣기] → 바로 입력칸
    render(); if (tab==='mine'){ try{ payData = await rpc('staff_pay',{p_token:TOKEN,p_month:ymd(month)}); }catch(_){ payData=[]; } render(); } }
  catch(e){ document.getElementById('app').innerHTML = `<div class="err"><img class="logo" src="../logo.svg" alt="" style="width:48px;height:48px"><h2>링크를 확인해주세요</h2><p>${esc(errMsg(e))}</p></div>`; }
  document.addEventListener('visibilitychange', async () => { if (document.visibilityState==='visible' && D && !['paint','ev','shoot'].includes(tab)){ try{ await load(); render(); }catch(_){} } });
})();
})();
</script>
