<script>/* ?app=chat → 대화만 따로 쓰는 '어닝톡' 앱 모드 (홈 화면에 추가용) */
(function(){ if (new URLSearchParams(location.search).get('app') !== 'chat') return;
  document.documentElement.classList.add('chatapp'); document.title = '어닝톡';
  var h = document.head, add = function(t, a){ var e = document.createElement(t); for (var k in a) e.setAttribute(k, a[k]); h.appendChild(e); };
  add('meta', {name:'apple-mobile-web-app-capable', content:'yes'}); add('meta', {name:'mobile-web-app-capable', content:'yes'});
  add('meta', {name:'apple-mobile-web-app-title', content:'어닝톡'}); add('meta', {name:'apple-mobile-web-app-status-bar-style', content:'default'});
  add('link', {rel:'apple-touch-icon', href:'../talk-180.png'}); add('link', {rel:'manifest', href:'../talk.webmanifest'});
  if (!/^#chat/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search + '#chat');
  window.addEventListener('hashchange', function(){ if (!/^#chat/.test(location.hash)) location.hash = 'chat'; });   // 앱 모드에선 대화 화면만
})();</script>
